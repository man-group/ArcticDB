name: Test CI scripts
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "build_tooling/vcpkg_caching.sh"
      - "build_tooling/sccache_config.sh"
      - "build_tooling/resolve_cibw_image.sh"
      - "build_tooling/build_many_linux_image.sh"
  push:
    branches: [master]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "build_tooling/vcpkg_caching.sh"
      - "build_tooling/sccache_config.sh"
      - "build_tooling/resolve_cibw_image.sh"
      - "build_tooling/build_many_linux_image.sh"

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pyyaml markdown pymdown-extensions

      - name: Run tests
        working-directory: .github/scripts
        run: python -m pytest tests/ -v
