# The arctic-winds benchmark pipeline, running in shadow mode beside
# `analysis_workflow.yml`. Install as `.github/workflows/benchmark_winds.yml`; it changes
# nothing about the existing workflow, and writes to its own results library
# (`winds_asv_results`), so the two can run against the same commits and be compared.
#
#   plan ──┬─► cibw_docker_image ─► build ─────────┐
#          ├──────────────────────► build_windows ─┤   (only when a lane needs it)
#          └───────────────────────────────────────┴─► worker (matrix) ─► collect
#                                                                            └─► publish_pr_page
#
# The site those pages belong to is rebuilt by `publish_winds_site.yml`, which reads the
# results store and needs nothing from a benchmark run.
#
# The job graph is the mock proven in arctic-winds itself (docs/gha-mock.md, run
# 33402171097), with the two substitutions that ticket documented: EC2 start/stop around
# each worker (in `benchmark_worker.yml`) and a lean cibuildwheel `build` job feeding
# `bench --wheel` instead of a PyPI requirement.
#
# Triggers mirror `analysis_workflow.yml` exactly, so the shadow sees the same events.
name: Benchmarks (arctic-winds)

on:
  workflow_dispatch:
    inputs:
      run_all_benchmarks:
        description: Run all benchmarks (every release tag from v5.3.0 up)
        type: boolean
        default: false
      storage:
        # NIGHTLY is not a storage: it asks for whatever the cron would have picked
        # tonight (REAL, or ALL when this commit has no push run), and exists so the
        # nightly's choice can be exercised on demand — a schedule only ever fires on
        # the default branch, so until the cut-over nothing else runs that branch.
        description: Storage to run benchmarks against (NIGHTLY = what the cron would pick)
        type: choice
        options:
          - 'LMDB'
          - 'REAL'
          - 'ALL'
          - 'NIGHTLY'
        default: 'LMDB'
      suite_overwrite:
        description: Regular expression to run instead of the workers.toml split
        type: string
        default: ''

  # Push to master, LMDB only, so PR runs have recent master results to compare against.
  push:
    branches:
      - master
      # TEMPORARY: lets the shadow branch trigger itself on push. (The Actions web
      # UI cannot list a workflow absent from the default branch, but
      # `gh workflow run --ref benchmark-winds-shadow` dispatches it fine —
      # verified 2026-09-02.) Remove at cut-over.
      - benchmark-winds-shadow

  # Nightly REAL storage — the half the push trigger never measures — falling back to
  # ALL when the head commit has no push run of its own (see `resolve the storage`).
  # Same cron as `analysis_workflow.yml`; while both pipelines run, this adds to the
  # nightly EC2 spend — offset or drop it if that matters.
  schedule:
    - cron: '0 0 * * *'

  pull_request:
    paths-ignore:
      - "**/*.md"

# No workflow-level `concurrency:` block, deliberately. `analysis_workflow.yml` has none
# either, and `cancel-in-progress` is actively dangerous here: cancelling a run *during* an
# EC2 start orphans the instance (docs/research/gha-ec2-runner-matrix.md §Q4). The one
# concurrency group in this file is on `publish_pr_page`, which holds no runner but does
# write to a shared branch; the comment there says why it is keyed per pull request.

jobs:
  # What gets benchmarked, by whom, on what storage. Also the run's only guard against
  # GitHub's 256-job matrix cap.
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # `actions: read` is what `resolve the storage` needs to ask the Actions API whether
    # this commit already has a push run. Naming one permission drops every default, so
    # `contents: read` — the checkout — has to be named alongside it.
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.commit.outputs.commit }}
      workers: ${{ steps.suites.outputs.workers }}
      # The lanes gha 26 Q4 says may never produce a verdict — `gating = false` in
      # workers.toml. `arctic-winds plan` writes this beside the matrix, because the plan
      # is the one thing that read the config; `collect` and `compare-values` both take it.
      measure_only: ${{ steps.plan.outputs.measure_only }}
      # The wheels this run's lanes can install, derived from their `runs_on` labels
      # (gha 41) — `manylinux_x86_64` always, plus `win_amd64` when a Windows lane is
      # planned. The per-platform build jobs below are gated on it, so a run without
      # such a lane never starts a Windows build.
      wheel_platforms: ${{ steps.plan.outputs.wheel_platforms }}
      reference_suite: ${{ steps.suites.outputs.reference_suite }}
      storage: ${{ steps.storage.outputs.storage }}
      bucket: ${{ steps.bucket.outputs.bucket }}
    steps:
      # `fetch-depth: 0`: `plan --all-tags` walks the release tags with `git rev-list`.
      - name: check out ArcticDB
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # arctic-winds requires >=3.11,<3.12

      # arctic-winds is a private repo today, so it is checked out with a read-only deploy
      # key (`ARCTIC_WINDS_DEPLOY_KEY`; see docs/arcticdb/README.md) instead of being
      # pip-installed from a URL. A public repo — or a move into man-group — makes the key
      # unnecessary and this can become `pip install git+https://…`.
      - name: check out arctic-winds
        uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: main
          path: arctic-winds
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}

      - name: install arctic-winds
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./arctic-winds

      - name: resolve the commit
        id: commit
        run: |
          # On a pull_request this is the merge commit actions/checkout produced, which is
          # what today's pipeline benchmarks too (`asv run … HEAD^!`). Resolved before the
          # storage, which asks the Actions API about this exact SHA.
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # LMDB on push and PRs, REAL on the nightly, whatever the dispatch asked for
      # otherwise. `analysis_workflow.yml:79` keys ALL off `github.ref_name == 'master'`;
      # the shadow keys the nightly off the schedule so master pushes stay cheap.
      #
      # Why the nightly is REAL and not ALL (gha 28, gha 31): the push trigger already
      # measured LMDB for every master commit, so an ALL nightly re-measures a point that
      # exists. The exception is a commit no push run ever benchmarked — a quiet day, a
      # push whose run was cancelled, the shadow branch before its trigger existed — and
      # for that commit the nightly is the only chance at an LMDB point, so it runs ALL.
      #
      # "Has an LMDB point" is asked of the Actions API, not of the results store, on
      # purpose. The store is the ground truth, but reading it here would mean giving this
      # job the AWS credentials it deliberately does without until the very last step,
      # duplicating `collect`'s shadow library-name derivation, and failing the nightly
      # outright on a transient S3 error. The API answers the question the fallback is
      # actually about — *did a push run happen for this commit* — from a token the job
      # already has, and can fail open to ALL.
      - name: resolve the storage
        id: storage
        env:
          REQUESTED: ${{ inputs.storage }}
          # Only a push event carries a head commit; empty otherwise.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This file's own name: `/actions/workflows/<file>/runs` scopes the query to
          # this workflow, so `analysis_workflow.yml`'s runs never answer for it.
          WORKFLOW_FILE: benchmark_winds.yml
        run: |
          # REAL unless this commit has no push run of its own, in which case ALL.
          # `success` and `failure` both count: those are the two terminal conclusions
          # where `collect` ran (`if: always() && needs.plan.result == 'success'`) and
          # stored whatever the workers reported. A run that failed so early it stored
          # nothing would fail identically tonight, so ALL would not have rescued it.
          # Anything else — cancelled, timed out, still running, no run at all — means
          # no dependable LMDB point, and ALL is the safe direction.
          nightly_storage() {
            if ! completed=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?event=push&status=completed&head_sha=${COMMIT}&per_page=100" \
                  --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")] | length' \
                  2>/dev/null); then
              echo "::warning::Could not ask the Actions API whether ${COMMIT:0:8} has a push run; running ALL." >&2
              echo ALL
            elif [ "${completed:-0}" -gt 0 ] 2>/dev/null; then
              echo "${COMMIT:0:8} already has ${completed} completed push run(s): the LMDB half is stored." >&2
              echo REAL
            else
              echo "${COMMIT:0:8} has no completed push run, so nothing measured its LMDB half yet." >&2
              echo ALL
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$REQUESTED" = NIGHTLY ]; then
            storage=$(nightly_storage)
          elif [ -n "$REQUESTED" ]; then
            storage="$REQUESTED"
          else
            # TEMPORARY, tied to the shadow push trigger above: lets a shadow
            # *push* run ask for a storage in its commit message. (Dispatch via
            # `gh workflow run --ref` also works and takes the input directly.)
            case "$HEAD_MESSAGE" in
              *'[storage=ALL]'*) storage=ALL ;;
              *'[storage=REAL]'*) storage=REAL ;;
              *) storage=LMDB ;;
            esac
          fi
          echo "storage: $storage"
          printf 'storage=%s\n' "$storage" >> "$GITHUB_OUTPUT"

      # `arctic-winds plan` appends `matrix=<compact json>` to $GITHUB_OUTPUT itself.
      - name: plan the matrix
        id: plan
        env:
          ALL_TAGS: ${{ inputs.run_all_benchmarks }}
          SUITE_OVERWRITE: ${{ inputs.suite_overwrite }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          STORAGE: ${{ steps.storage.outputs.storage }}
        run: |
          # `--storage REAL` drops the workers marked `real = false` in workers.toml —
          # the six with no AMAZON-parameterized benchmarks, which on real storage would
          # rent an instance each to re-measure their LMDB numbers (gha 28/31). LMDB and
          # ALL keep all twelve. An unrecognised storage is a plan error, not a full
          # matrix, so a typo in the step above cannot quietly cost twelve instances.
          args=(--config python/benchmarks/workers.toml --repo . --storage "$STORAGE")
          if [ "$ALL_TAGS" = "true" ]; then
            args+=(--all-tags)
          else
            args+=(--commit "$COMMIT")
          fi
          if [ -n "$SUITE_OVERWRITE" ]; then
            args+=(--suite-overwrite "$SUITE_OVERWRITE")
          fi
          arctic-winds plan "${args[@]}"

      # GitHub caps a matrix at 256 jobs and silently truncates past it, which would look
      # like a run where some workers simply never reported. Fail here instead. 13 workers
      # x 69 release tags = 897, so `run_all_benchmarks` needs a tag subset or a narrower
      # split (see the README's open decisions). The job count is the only guard left: a
      # multi-commit run is otherwise fine now that artifacts are named per commit and
      # `collect` writes a symbol for each (ticket 18).
      - name: check the matrix against GitHub's 256-job cap
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          count=$(jq 'length' <<<"$MATRIX")
          commits=$(jq '[.[].commit] | unique | length' <<<"$MATRIX")
          echo "planned jobs: $count over $commits commit(s)"
          if [ "$count" -gt 256 ]; then
            echo "::error::planned $count matrix jobs, over GitHub's 256-job cap. Reduce the workers in python/benchmarks/workers.toml or benchmark fewer tags; a truncated matrix would silently drop workers."
            exit 1
          fi

      # Two things the matrix implies that later jobs need as plain strings: who must have
      # uploaded (`collect --expect`) and the single regex a reference run would use.
      # Derived from the matrix, so a `suite_overwrite` dispatch stays consistent.
      - name: derive the worker list and the combined suite
        id: suites
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          printf 'workers=%s\n' "$(jq -r '[.[].worker] | unique | join(",")' <<<"$MATRIX")" \
            >> "$GITHUB_OUTPUT"
          printf 'reference_suite=%s\n' "$(python -c "import json, os; from arctic_winds.orchestrator import combined_suite; print(combined_suite({e['worker']: e['suite'] for e in json.loads(os.environ['MATRIX'])}))")" \
            >> "$GITHUB_OUTPUT"

      - name: report the plan
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          STORAGE: ${{ steps.storage.outputs.storage }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          WHEEL_PLATFORMS: ${{ steps.plan.outputs.wheel_platforms }}
        run: |
          {
            echo "### 🌬️ arctic-winds plan"
            echo
            echo "- head commit: \`$COMMIT\`"
            echo "- storage: \`$STORAGE\`"
            # The one line that says why a run has two build jobs and the last one had
            # one: a platform is here because some lane's label asked for it.
            echo "- wheels: \`$WHEEL_PLATFORMS\`"
            if [ "$STORAGE" = REAL ]; then
              # The one line that explains a six-row table where a reader expects twelve.
              echo "- the workers marked \`real = false\` in \`workers.toml\` are skipped: they have no AMAZON-parameterized benchmarks"
            fi
            echo
            # One row per matrix entry, commit included: `run_all_benchmarks` plans every
            # release tag, and which commit a worker is on is then the first question.
            # `runs on` is the label the job queues against — `ec2` for the lanes whose
            # label only exists once an instance has been started for them — and `gates`
            # is whether that lane's numbers may fail a pull request (gha 26 Q4).
            echo "| commit | worker | suite | instance | runs on | gates |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.commit[0:8]) | \(.worker) | `\(.suite)` | \(.instance_type) | \(if .runs_on == "" then "ec2" else .runs_on end) | \(if .gating then "yes" else "measure-only" end) |"' <<<"$MATRIX"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------------
      # TICKET 11 (REAL storage) — everything below is that ticket's scope, and inert
      # unless the storage input asks for it. A per-run throwaway bucket, created once
      # and shared by every worker, instead of `benchmark_commits.yml:77-85`'s
      # per-commit-job bucket; each worker writes under its own `path_prefix` inside it
      # (`benchmark_worker.yml`'s `ARCTICDB_REAL_S3_BUCKET` comment). Deleted in
      # `collect`.
      #
      # Deliberately the *last* step of this job. `collect` — the only thing that deletes
      # the bucket — will not run at all unless `plan` succeeded, so a bucket created
      # before a step that then fails is a bucket nothing ever removes. With nothing after
      # it, the only way to strand one is for `aws s3 mb` to succeed and the very next
      # `printf` to fail. It also means a run rejected by the 256-job check never creates
      # a bucket in the first place. For the same reason the CloudWatch metrics
      # configuration is asked for *after* the bucket name is on `$GITHUB_OUTPUT`, and
      # cannot fail the step: a missing `s3:PutMetricsConfiguration` grant must cost the
      # run its request counts, never its cleanup.
      # ---------------------------------------------------------------------------
      - name: create the throwaway test bucket
        id: bucket
        if: steps.storage.outputs.storage != 'LMDB'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          ARCTICDB_REAL_S3_REGION: eu-west-1
          ARCTICDB_REAL_S3_ENDPOINT: s3.eu-west-1.amazonaws.com
        run: |
          random_id=$(openssl rand -hex 4)
          timestamp=$(date +%s)
          bucket_name="arcticdb-asv-data-${timestamp}-${random_id}"
          aws s3 mb --endpoint-url "http://${ARCTICDB_REAL_S3_ENDPOINT}" \
            --region "${ARCTICDB_REAL_S3_REGION}" "s3://${bucket_name}"
          echo "Created bucket s3://${bucket_name}"
          printf 'bucket=%s\n' "$bucket_name" >> "$GITHUB_OUTPUT"
          # On the summary because it is the one name a human needs if a run ends
          # without `collect` and the bucket has to be swept by hand.
          echo "- throwaway bucket: \`$bucket_name\` (deleted by \`collect\`)" \
            >> "$GITHUB_STEP_SUMMARY"

          # S3 request metrics, so CloudWatch counts this run's AllRequests /
          # PutRequests / GetRequests / ListRequests (gha 28's open question: request
          # charges are ~60 % of a REAL run's bill and carry its only wide error bar,
          # $0.85–2.75 on an estimate). No `Filter` means the whole bucket — a filter
          # would scope the metrics to a prefix, and the point is the run's total.
          # The configuration is a sub-resource of the bucket, so `aws s3 rb` in
          # `collect` takes it with the bucket: nothing to clean up. Metrics already
          # published stay in CloudWatch and are billed like a custom metric, ~$0.30
          # per metric-month prorated — four metrics for the hours a run lasts.
          if aws s3api put-bucket-metrics-configuration \
              --endpoint-url "http://${ARCTICDB_REAL_S3_ENDPOINT}" \
              --region "${ARCTICDB_REAL_S3_REGION}" \
              --bucket "${bucket_name}" \
              --id winds \
              --metrics-configuration '{"Id":"winds"}'; then
            echo "- S3 request metrics: CloudWatch \`AWS/S3\` request metrics, filter id \`winds\` (~15 min lag)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not enable S3 request metrics on ${bucket_name} (s3:PutMetricsConfiguration?); the run is unaffected but there will be no CloudWatch request counts."
          fi

  # ~6 s job; resolves ghcr.io/man-group/arcticdb_manylinux:<ver>-<hash> the same way
  # `build.yml:122-128` does, so the benchmark wheel uses the identical manylinux image.
  cibw_docker_image:
    name: cibuildwheel image
    uses: ./.github/workflows/cibw_docker_image.yml
    permissions: {packages: write}
    with:
      cibuildwheel_ver: "3.1.4"   # keep in sync with build.yml:128
      force_update: false

  # One cp311 manylinux wheel per run, for every worker to install. Measured ~7 min, ~2 %
  # of a benchmark run and cheaper than the 11 min source build the pipeline does today;
  # calling `build_steps.yml` instead would drag its 38-job, 49-minute cp311 test matrix
  # along. See docs/research/gha-wheel-build-job.md, which this job is copied from.
  #
  # Unconditional, unlike `build_windows` below: every plan has at least one Linux lane —
  # the twelve EC2 workers are Linux and so is any unrecognised label — so gating this
  # would be a condition that is never false with a cost of its own to read.
  build:
    name: build cp311 wheel
    needs: [cibw_docker_image]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run: {shell: bash}
    env:
      # ---- copied from build_steps.yml:46-79; keep the two in sync ----
      SCCACHE_GHA_VERSION: ${{ secrets.AWS_S3_ACCESS_KEY == null }}
      SCCACHE_BUCKET: arcticdb-ci-sccache-bucket
      SCCACHE_ENDPOINT: http://s3.eu-west-1.amazonaws.com
      SCCACHE_REGION: eu-west-1
      SCCACHE_S3_USE_SSL: false
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      VCPKG_NUGET_USER: ${{ secrets.VCPKG_NUGET_USER || github.repository_owner }}
      VCPKG_NUGET_TOKEN: ${{ secrets.VCPKG_NUGET_TOKEN || secrets.GITHUB_TOKEN }}
      VCPKG_MAN_NUGET_USER: ${{ secrets.VCPKG_MAN_NUGET_USER }}
      VCPKG_MAN_NUGET_TOKEN: ${{ secrets.VCPKG_MAN_NUGET_TOKEN }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      ARCTIC_CMAKE_PRESET: linux-release   # benchmarks must never run a debug build
      ARCTICDB_BUILD_DIR: /tmp/cpp_build
      CIBW_BUILD: cp311-manylinux_x86_64   # the whole point: exactly one wheel
      CIBW_ENVIRONMENT_PASS_LINUX: SCCACHE_GHA_VERSION ACTIONS_CACHE_URL ACTIONS_RUNTIME_TOKEN
        VCPKG_INSTALLATION_ROOT VCPKG_BINARY_SOURCES VCPKG_NUGET_USER VCPKG_NUGET_TOKEN
        VCPKG_MAN_NUGET_USER VCPKG_MAN_NUGET_TOKEN CMAKE_C_COMPILER_LAUNCHER
        CMAKE_CXX_COMPILER_LAUNCHER CMAKE_BUILD_PARALLEL_LEVEL ARCTIC_CMAKE_PRESET
        ARCTICDB_BUILD_DIR X_VCPKG_ASSET_SOURCES
        SCCACHE_BUCKET SCCACHE_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        SCCACHE_REGION SCCACHE_S3_USE_SSL
      CIBW_ENVIRONMENT_LINUX: COPY_VCPKG_DOWNLOADS_TO_HOST=1
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      # The run's own commit is the one that gets benchmarked, so no `ref:` here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: init submodules
        run: |
          git submodule update --init --recursive
          git -C cpp/vcpkg submodule update --init --recursive

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: 'true'

      - name: free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
          docker-images: false

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'   # same pin as build_steps.yml

      - name: extra envs
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          HOME=~ . build_tooling/vcpkg_caching.sh
          echo -e "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          VCPKG_ROOT=$PLATFORM_VCPKG_ROOT
          ${X_VCPKG_ASSET_SOURCES:+X_VCPKG_ASSET_SOURCES=$X_VCPKG_ASSET_SOURCES}" | tee -a "$GITHUB_ENV"
          cmake -P cpp/CMake/CpuCount.cmake | sed 's/^-- //' | tee -a "$GITHUB_ENV"

      - name: pull the cibuildwheel manylinux image
        env:
          IMAGE: ${{ needs.cibw_docker_image.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u token -p "$GHCR_TOKEN"
          docker pull "$IMAGE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # host interpreter that runs cibuildwheel

      - name: build the wheel
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ needs.cibw_docker_image.outputs.tag }}
          CIBW_VERSION: ${{ needs.cibw_docker_image.outputs.cibuildwheel_ver }}
        run: |
          python -m pip install pipx --retries 3 --timeout 180
          python -m pipx run "cibuildwheel==$CIBW_VERSION"

      - name: store the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cp311-manylinux_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7   # only ever needed inside this run

  # The same job for `cp311-win_amd64`, and the reason ticket 41 exists: a lane on
  # `windows-latest` cannot install a manylinux wheel, so `uv pip install` refuses it and
  # the pilot lane can never go green (gha 37). The Windows half of `build_steps.yml` is
  # what this is copied from — `build.yml:170-179`'s `windows_matrix` (preset
  # `windows-cl`, build dir `C:/cpp_build`, vcpkg packages on `C:/`) plus the four
  # Windows-only steps `build_steps.yml` guards on `matrix.os == 'windows'`.
  #
  # `if:` is the whole cost story. The plan derives each lane's wheel platform from its
  # `runs_on` label and publishes the distinct set, so this job exists only on a run that
  # planned a Windows lane. Until the `windows_pilot` worker is mirrored onto the shadow
  # branch's `workers.toml` — it is staged in arctic-winds and held back until gha 42
  # lands Windows provisioning — that is no run at all: every one skips this job and
  # pays a skipped job's zero minutes, and a `storage=REAL` run keeps skipping it after
  # the mirror, because the pilot is `real = false` and REAL drops it from the matrix.
  # When it does run it is one hosted Windows runner for the length of a cibuildwheel
  # build — free on a public repository, and concurrent with the manylinux build rather
  # than after it.
  #
  # Not gated on `cibw_docker_image`'s *image* — that is the manylinux container and
  # means nothing here — but it does `needs:` that job for the one thing it publishes
  # that both builds must agree on: the cibuildwheel version.
  build_windows:
    name: build cp311 win_amd64 wheel
    needs: [plan, cibw_docker_image]
    if: contains(needs.plan.outputs.wheel_platforms, 'win_amd64')
    # `windows-2022`, matching `build.yml:172`, and not for the toolchain (the pinned
    # MSVC below is installed by the job either way): vcpkg builds its ports with the
    # highest-versioned CMake it can find, and `windows-latest`'s image CMake (>=4.4)
    # outranks the 3.31.6 this job pins — 4.4 rejects the `benchmark` port's
    # `-Werror=old-style-cast` and the configure dies (proven on run 33791851057;
    # the same PATH-ordering trap `build_steps.yml` documents for macOS). On the
    # 2022 image the pinned CMake is the newest one vcpkg sees. Revisit when the
    # port is fixed upstream and build_steps.yml drops its pin.
    runs-on: windows-2022
    # Longer than the manylinux 45: Windows has no warm S3 sccache of its own to lean on
    # for a first build, and the MSVC install alone is minutes.
    timeout-minutes: 90
    defaults:
      run: {shell: bash}
    env:
      # ---- copied from build_steps.yml:46-79, Windows column; keep the two in sync ----
      SCCACHE_GHA_VERSION: ${{ secrets.AWS_S3_ACCESS_KEY == null }}
      SCCACHE_BUCKET: arcticdb-ci-sccache-bucket
      SCCACHE_ENDPOINT: http://s3.eu-west-1.amazonaws.com
      SCCACHE_REGION: eu-west-1
      SCCACHE_S3_USE_SSL: false
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      VCPKG_NUGET_USER: ${{ secrets.VCPKG_NUGET_USER || github.repository_owner }}
      VCPKG_NUGET_TOKEN: ${{ secrets.VCPKG_NUGET_TOKEN || secrets.GITHUB_TOKEN }}
      VCPKG_MAN_NUGET_USER: ${{ secrets.VCPKG_MAN_NUGET_USER }}
      VCPKG_MAN_NUGET_TOKEN: ${{ secrets.VCPKG_MAN_NUGET_TOKEN }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      ARCTIC_CMAKE_PRESET: windows-cl-release   # benchmarks must never run a debug build
      # Both on C: because the checkout is on D: and the build does not fit beside it —
      # `build.yml:174-175`'s answer, and the reason its archive step templates its
      # exclusions with a drive letter.
      ARCTICDB_BUILD_DIR: C:/cpp_build
      ARCTICDB_VCPKG_PACKAGES_DIR: C:/vcpkg_packages
      CIBW_BUILD: cp311-win_amd64   # the whole point: exactly one wheel
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      # The run's own commit is the one that gets benchmarked, so no `ref:` here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: init submodules
        run: |
          git submodule update --init --recursive
          git -C cpp/vcpkg submodule update --init --recursive

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: 'true'

      # `build_steps.yml:113-120`. The linker runs out of memory on the default pagefile;
      # `continue-on-error` because the action fails on images that will not resize, and
      # a build that then succeeds anyway must not be lost to it.
      - name: enlarge the pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        continue-on-error: true
        with:
          minimum-size: 2GB
          maximum-size: 6GB
          disk-root: "D:"   # also the checkout drive; 12GB in total

      # ArcticDB PR #945: a ccache on PATH hijacks the compiler launcher sccache is set
      # to, and the build fails inside vcpkg where it is hardest to read.
      - name: remove ccache
        run: rm "$(which ccache)" || true

      # `build_steps.yml:151-158`. A GitHub image update moves MSVC under us, and a new
      # MSVC has broken both ArcticDB and its vcpkg dependencies before; the version and
      # the toolset are pinned to what `custom-triplets/x64-windows-static-msvc.cmake`
      # expects. Keep all three in sync with `build_steps.yml`.
      - name: install the pinned MSVC
        run: |
          choco install -y -f visualstudio2022buildtools --version=117.11.4 \
            --params "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --installChannelUri https://aka.ms/vs/17/release/390666095_1317821361/channel"
          choco install -y ninja

      - name: enable the Windows compiler commands
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64
          toolset: 14.41
          vs-path: 'C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools'

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'   # same pin as build_steps.yml

      # Must come after setup-msvc-dev, which sets a VCPKG_ROOT of its own that this
      # overwrites (`build_steps.yml:122-123`).
      - name: extra envs
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          HOME=~ . build_tooling/vcpkg_caching.sh
          echo -e "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          VCPKG_ROOT=$PLATFORM_VCPKG_ROOT
          ${X_VCPKG_ASSET_SOURCES:+X_VCPKG_ASSET_SOURCES=$X_VCPKG_ASSET_SOURCES}" | tee -a "$GITHUB_ENV"
          cmake -P cpp/CMake/CpuCount.cmake | sed 's/^-- //' | tee -a "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # host interpreter that runs cibuildwheel

      # No `CIBW_ENVIRONMENT_PASS_*` and no image: cibuildwheel builds Windows wheels in
      # this job's own environment, so the sccache and vcpkg variables above are already
      # in scope for the compiler. The cibuildwheel version comes from the same job the
      # manylinux build takes it from, so the two wheels are built by one version.
      - name: build the wheel
        env:
          CIBW_VERSION: ${{ needs.cibw_docker_image.outputs.cibuildwheel_ver }}
        run: |
          python -m pip install pipx --retries 3 --timeout 180
          python -m pipx run "cibuildwheel==$CIBW_VERSION"

      - name: store the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cp311-win_amd64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7   # only ever needed inside this run

  # The fan-out. One matrix entry = one call of the reusable worker workflow. For a lane
  # with an `ec2` table (or the bare `instance_type` the twelve ArcticDB workers use) that
  # is one EC2 instance, started and stopped inside the call; for a lane with a `runs_on`
  # label it is a job that queues against that label and rents nothing (see
  # benchmark_worker.yml).
  worker:
    needs: [plan, build, build_windows]
    # `build_windows` is skipped on every run with no Windows lane, and a skipped `need`
    # takes its dependents with it unless the job says otherwise — the same trap
    # `benchmark_worker.yml`'s bench job steps around for a skipped `start`. So the
    # guard names what actually has to have happened: the plan and the manylinux wheel
    # succeeded, and the Windows wheel is anything but failed (success, or skipped
    # because nobody asked for it). `!cancelled()` rather than `always()`, because a
    # cancelled run must not go on to rent twelve instances.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.build_windows.result != 'failure'
    strategy:
      fail-fast: false   # one worker dying must not cancel the other seven
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: worker ${{ matrix.worker }}
    uses: ./.github/workflows/benchmark_worker.yml
    # Carries AWS_S3_*, ARCTICDB_TEST_PAT and ARCTIC_WINDS_DEPLOY_KEY into the call.
    secrets: inherit
    with:
      worker: ${{ matrix.worker }}
      suite: ${{ matrix.suite }}
      # The matrix's own commit, in full: `plan` emits 40-char SHAs because
      # `actions/checkout` treats anything shorter as a branch or tag name (the first
      # shadow run failed on `refs/heads/44a66493*`). One entry per (commit, worker), so
      # a `run_all_benchmarks` run sends each worker the tag it is benchmarking rather
      # than the plan's single HEAD (ticket 18).
      commit: ${{ matrix.commit }}
      storage: ${{ needs.plan.outputs.storage }}
      instance_type: ${{ matrix.instance_type }}
      # gha 26's provider seam. Empty means "start us an EC2 instance"; a label means the
      # lane runs on a runner somebody else owns, and `benchmark_worker.yml` skips its
      # start and stop jobs entirely. `market_type` is spot for the EC2 lanes and empty
      # for everything else, which is also how the action spells on-demand.
      runs_on: ${{ matrix.runs_on }}
      market_type: ${{ matrix.market_type }}
      python: "3.11"
      # Which of the run's wheels this lane installs (gha 41). `plan` derived the
      # platform from the lane's own label — `windows-*` is `win_amd64`, `macos-*` is
      # `macosx_arm64`, everything else (an EC2 lane included) is `manylinux_x86_64` —
      # and the build jobs above name their artifacts to the same shape, which is
      # `build_steps.yml:500`'s `wheel-${CIBW_BUILD}`. A lane whose wheel was never
      # built would fail on `download-artifact`, but it cannot arise: the platforms the
      # build jobs are gated on are this same list, from this same plan.
      wheel_artifact: wheel-cp311-${{ matrix.wheel_platform }}
      bucket: ${{ needs.plan.outputs.bucket }}

  # Every worker's artifact back into one symbol in the S3 results store, the reports on
  # the job summary, and — on a PR — the regression check against master.
  collect:
    name: collect
    needs: [plan, worker]
    # `always()` so a run where one worker died still stores what the others measured and
    # still reports the missing worker (collect exits 1, and the job goes red).
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # `actions: read` is what `download-artifact` needs once a job names its
    # permissions at all — naming one drops every default. Nothing here writes to the
    # repository any more: the pull request's page moved to `publish_pr_page` below,
    # which is the job that holds `contents: write`.
    permissions:
      contents: read
      actions: read
    outputs:
      library: ${{ steps.library.outputs.library }}
    env:
      # The bucket and prefix `transform_asv_results.py` writes to today. `aws_auth=true`
      # means arcticdb takes the credentials from the standard AWS environment below.
      RESULTS: "s3://s3.eu-west-1.amazonaws.com:arcticdb-ci-benchmark-results?aws_auth=true&region=eu-west-1&path_prefix=asv_results"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
      COMMIT: ${{ needs.plan.outputs.commit }}
      WORKERS: ${{ needs.plan.outputs.workers }}
      MEASURE_ONLY: ${{ needs.plan.outputs.measure_only }}
    steps:
      # `fetch-depth: 0`: `compare-values` walks up to 50 `origin/master~N` commits looking
      # for the newest one with stored results (it runs `git fetch origin master` first,
      # which cannot deepen a shallow clone usefully).
      - name: check out ArcticDB
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: check out arctic-winds
        uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: main
          path: arctic-winds
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}

      - name: install arctic-winds and asv
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./arctic-winds
          # `compare-values` shells out to `asv compare`; asv is not an arctic-winds
          # dependency. Same requirement `arctic_winds/env.py` provisions on a worker.
          python -m pip install "asv @ git+https://github.com/airspeed-velocity/asv"

      - name: download every artifact
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: false

      # `download-artifact` gives each artifact its own subdirectory, and the directory
      # name is how `collect` learns the worker's name. The run's wheels are artifacts too
      # and are not workers, so they are moved aside before collect sees the directory.
      # The `wheel-*` glob covers every platform the plan can name — the artifacts are
      # `wheel-cp311-manylinux_x86_64` and `wheel-cp311-win_amd64` — so a second wheel
      # changes nothing here, which is what `tests/test_workflow_lanes.py` pins.
      # So is `compare-report`, which this job uploads for `publish_pr_page` — on a
      # *re-run* of this job the previous attempt's copy is already there to download,
      # and an artifact called `compare-report` would otherwise become a worker of that
      # name with no results in it.
      - name: separate the worker artifacts from the wheel
        run: |
          mkdir -p artifacts
          for dir in all-artifacts/*/; do
            name=$(basename "$dir")
            case "$name" in
              wheel-*|compare-report) continue ;;
            esac
            mv "$dir" "artifacts/$name"
          done
          find artifacts -type f | sort

      # Shadow mode writes to `winds_asv_results`, never CI's live `asv_results`. That is
      # `library_for()`'s rule with a different base, which the CLI's `--ref-name` cannot
      # express (it hardcodes `asv_results`), so the name is derived here instead.
      - name: name the results library
        id: library
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            library=winds_asv_results
          else
            library="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '_')_winds_asv_results"
          fi
          echo "library: $library"
          printf 'library=%s\n' "$library" >> "$GITHUB_OUTPUT"

      # Exit 1 = a benchmark failed or a worker never uploaded; the job is meant to go red,
      # and the results that did arrive are stored either way. Exit 2 = nothing was stored.
      # No `--commit`: the download holds one artifact per (worker, commit), so `collect`
      # groups them by the commit each result was measured at, writes a symbol for each,
      # and puts a report per commit on this job's summary (ticket 18). A
      # `run_all_benchmarks` run stores every tag it benchmarked, not just the first.
      - name: collect the run
        env:
          LIBRARY: ${{ steps.library.outputs.library }}
        run: |
          # `--measure-only` is still expected of, and reported for, every lane it names;
          # it only stops a managed lane's silence or failures from turning the job red
          # (gha 26 Q4). The summary says which lanes those were.
          arctic-winds collect \
            --artifacts artifacts \
            --results "$RESULTS" \
            --library "$LIBRARY" \
            --expect "$WORKERS" \
            --measure-only "$MEASURE_ONLY"

      # The PR regression check, replacing `asv compare -s -f 1.15 <master> HEAD` from
      # `benchmark_commits.yml:150-166`. Exit 1 = something got worse; exit 2 = the check
      # could not be made (no fresh master reference) — both fail the job, as the `|| exit 1`
      # chain does today.
      #
      # `--reference-lib asv_results` compares against **CI's own** master results, which
      # are the only ones that exist while the shadow is young; the numbers come from one
      # machine rather than eight, so treat early verdicts as directional. Switch this to
      # `winds_asv_results` once nightly/master shadow runs have populated it.
      # `--report` writes the same verdict as JSON, which the PR page below is built
      # from: asv must not be run a second time to say what this step already knows.
      - name: compare against master
        if: github.event_name == 'pull_request'
        env:
          LIBRARY: ${{ steps.library.outputs.library }}
        run: |
          # `--measure-only` drops the managed lanes' rows from *both* commits before asv
          # sees them. Two reasons, and the second is the sharp one: a GitHub-hosted
          # runner's ≈2.66 % CV would make the 1.15 threshold mostly false alarms, and an
          # OS-portable subset runs the *same benchmark names* as an EC2 lane — so without
          # this the pull request would be judged on whichever machine sorted last.
          arctic-winds compare-values \
            --commit "$COMMIT" \
            --tree . \
            --results "$RESULTS" \
            --library "$LIBRARY" \
            --reference-lib asv_results \
            --repo . \
            --measure-only "$MEASURE_ONLY" \
            --report "$GITHUB_WORKSPACE/compare-report.json"

      # The verdict, handed to `publish_pr_page`. The comparison must not be run twice
      # — asv would have to re-read both commits to say what this job already knows —
      # and a job boundary is the only way to move a file across one.
      #
      # `always()`: a regression makes the step above exit 1, and that is precisely the
      # run whose page is worth having.
      - name: keep the comparison for the page
        if: always() && github.event_name == 'pull_request' && hashFiles('compare-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: compare-report.json
          retention-days: 1
          # A re-run of this job uploads it a second time, and v4 refuses a name that
          # already exists rather than replacing it.
          overwrite: true

      # A fork's `GITHUB_TOKEN` is read-only, so nothing can be pushed to gh-pages from
      # one. The comparison itself still ran and is on this job's summary.
      - name: note the fork's missing page
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::No benchmark page for a pull request from a fork: a fork's GITHUB_TOKEN cannot write to gh-pages. The value comparison is in this job's summary."

      # ---------------------------------------------------------------------------
      # TICKET 11 (REAL storage) — the other half of the throwaway bucket created in
      # `plan`, with `benchmark_commits.yml:176-187`'s name guard so a bug in the
      # workflow can never delete a real bucket. Inert on LMDB runs.
      # ---------------------------------------------------------------------------
      - name: delete the throwaway test bucket
        if: always() && needs.plan.outputs.bucket != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          ARCTICDB_REAL_S3_REGION: eu-west-1
          ARCTICDB_REAL_S3_ENDPOINT: s3.eu-west-1.amazonaws.com
          BUCKET: ${{ needs.plan.outputs.bucket }}
        run: |
          if [[ $BUCKET == arcticdb-asv-data* ]]; then
            echo "Removing ${BUCKET}"
            aws s3 rb --force --endpoint-url "http://${ARCTICDB_REAL_S3_ENDPOINT}" \
              --region "${ARCTICDB_REAL_S3_REGION}" "s3://${BUCKET}"
          else
            echo "Unexpected bucket to clean up! ${BUCKET}"
            echo "This indicates a bug in the workflow. Not deleting anything and exiting..."
            exit 1
          fi

  # The pull request's page on the benchmark site: this run's numbers, the values
  # already published for the master commit it was judged against, and asv's verdict,
  # written to `winds/data/pr/<number>.json` on the gh-pages branch and linked from
  # this job's summary. Kept 90 days; `publish_winds_site.yml`'s nightly rebuild
  # prunes the expired ones and relists the rest.
  #
  # Its own job, not a step of `collect`, for one reason: `concurrency` is a property
  # of jobs, and the branch is the thing that needs serialising. Putting the group on
  # `collect` would queue the whole 30-minute job behind another run's, and — worse —
  # GitHub cancels a *pending* member of a group when a third arrives, so a busy
  # afternoon would silently drop a run's results before it ever stored them.
  #
  # The group is therefore per pull request. Two publishes of the *same* PR are two
  # attempts at one page, and cancelling the older pending one loses nothing, because
  # the newer run supersedes it. Two publishes of *different* PRs must both land, so
  # they are not in one group and are not queued behind each other at all — the race
  # between them is settled by the retry in the publish step, which rebuilds against
  # whatever the branch tip turns out to be instead of replaying a commit onto it.
  # Nothing in this job holds an EC2 runner: the workers are stopped by the time
  # `collect` finishes, and no `cancel-in-progress` appears anywhere near one.
  publish_pr_page:
    name: publish the pull request's page
    needs: [plan, collect]
    if: |
      always() && needs.plan.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    concurrency:
      group: winds-gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # The push to gh-pages, and `download-artifact`'s `actions: read`.
    permissions:
      contents: write
      actions: read
    env:
      RESULTS: "s3://s3.eu-west-1.amazonaws.com:arcticdb-ci-benchmark-results?aws_auth=true&region=eu-west-1&path_prefix=asv_results"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: eu-west-1
      COMMIT: ${{ needs.plan.outputs.commit }}
      LIBRARY: ${{ needs.collect.outputs.library }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SITE_PREFIX: winds
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: check out arctic-winds
        uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: main
          path: arctic-winds
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}

      - name: install arctic-winds
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./arctic-winds

      # Absent when the comparison could not be made (no fresh master reference, or asv
      # itself failed). The page is still written; every combination is then `new`.
      - name: fetch the comparison
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: compare-report

      - name: publish the pull request's page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The site lives on gh-pages under `winds/` until the cut-over; before that
          # branch exists there is nothing to publish into, and saying so is not a
          # reason to fail the run.
          if ! git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              gh-pages; then
            echo "::notice::No gh-pages branch yet, so the benchmark site has nowhere to put this pull request's page. Dispatch publish_winds_site.yml to build it."
            exit 0
          fi
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Everything the page depends on, done against whatever the branch tip is
          # *now*. The old shape was `push || (pull --rebase && push)`, which replays
          # this run's commit onto the winner's — and fails, because `index.json` is
          # one compact line that both sides rewrite whole, so the rebase conflicts
          # textually and the loser's page waits for a human to re-run the job. Writing
          # the page again on the new base has nothing to conflict with: `viz pr`
          # rebuilds `index.json`'s `prs` listing from the files on disk, so the
          # winner's page is in the listing this run publishes.
          attempt() {
            git -C gh-pages fetch --depth 1 origin gh-pages
            git -C gh-pages reset --hard FETCH_HEAD

            args=(--results "$RESULTS" --library "$LIBRARY" --commit "$COMMIT"
                  --pr "$PR_NUMBER" --site-dir "gh-pages/${SITE_PREFIX}/data")
            if [ -f compare-report.json ]; then
              args+=(--compare-report compare-report.json)
            fi
            arctic-winds viz pr "${args[@]}"

            git -C gh-pages add "${SITE_PREFIX}/data"
            if git -C gh-pages diff --cached --quiet; then
              echo "The page is unchanged; nothing to push."
              return 0
            fi
            git -C gh-pages commit --quiet -m "benchmarks: pull request #${PR_NUMBER} (${COMMIT:0:8})"
            git -C gh-pages push origin HEAD:gh-pages
          }

          published=no
          for try in 1 2 3; do
            if attempt; then
              published=yes
              break
            fi
            echo "::notice::Publish raced with another run (attempt ${try}); rewriting the page onto the new tip."
          done
          if [ "$published" != yes ]; then
            echo "::error::Could not publish this pull request's page after three attempts."
            exit 1
          fi

          page="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SITE_PREFIX}/pr/${PR_NUMBER}"
          echo "::notice::Benchmark page for this pull request: ${page}"
          {
            echo "### 🌬️ Benchmark page"
            echo
            echo "[Pull request #${PR_NUMBER}](${page}) — every benchmark, this run against master, with links into each history."
          } >> "$GITHUB_STEP_SUMMARY"
