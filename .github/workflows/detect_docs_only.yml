name: Detect docs-only changes
on:
  workflow_call:
    outputs:
      docs_only:
        description: "true if every changed file is docs/metadata and the build/test matrix can be skipped"
        value: ${{ jobs.detect.outputs.docs_only }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout (push only)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch previous commit (push only)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          before_sha="${{ github.event.before }}"
          if [[ -n "$before_sha" ]] && [[ ! "$before_sha" =~ ^0+$ ]]; then
            git fetch --depth=1 origin "$before_sha" || true
          fi

      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')

          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            before_sha="${{ github.event.before }}"
            if [[ -z "$before_sha" ]] || [[ "$before_sha" =~ ^0+$ ]] || ! git cat-file -e "$before_sha" 2>/dev/null; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            changed_files=$(git diff --name-only "$before_sha" "${{ github.sha }}")

          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          if [[ -z "$changed_files" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          non_docs_files=$(echo "$changed_files" | grep -Ev '(\.md$|^docs/|^LICENSE(\.[A-Za-z]+)?$|^\.gitignore$)' || true)

          if [[ -z "$non_docs_files" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
