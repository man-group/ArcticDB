# ===========================================================================
# EXPERIMENT — NOT PART OF THE PIPELINE. Delete this file and the branch it
# lives on (`benchmark-winds-datafusion-poc`) when the experiment is over.
# ===========================================================================
#
# DataFusion SQL PoC benchmarks on one rented EC2 box (datafusion-sql-poc
# ticket 41). The PoC source is NOT on this repository: it lives on a branch of
# the private `G-D-Petrov/arctic-winds`, as an ArcticDB tree at its root, and is
# checked out with the read-only `ARCTIC_WINDS_DEPLOY_KEY` every arctic-winds
# workflow on this branch already uses. Logs here are public, so nothing below
# prints the source.
#
#   plan ─ reuse ─┬─ wheel (cibuildwheel, cp311) ─┬─ start ─ bench ─ stop
#                 └─ crate (maturin, 2_28)  ──────┘
#
# `reuse builds` skips the wheel or the crate when an unexpired artifact of an
# earlier dispatch on this branch has the same key (the snapshot sha, the
# flamegraph variant, the build image digests and the build jobs' parsed YAML),
# and the bench job then downloads that run's artifact. The bench job checks
# each artifact's key file against this run's key before installing anything.
#
# The box runs `rust/arcticdb_sql/bench/ec2_driver.py` inside the dev image with
# `docker run --network host`, so the SeaweedFS + Toxiproxy stack it starts
# (`bench.s3_stack up --host-network`) and the benchmark share the host's
# loopback. No job container: GitHub's `container:` cannot take `--network`.
#
# Like `benchmark_real_io_ab.yml`, this deliberately does NOT collect. Results
# leave as GitHub artifacts (7 days) and nothing is written to any results
# library. S3 is the local stack, except for the `aws-same-region` and
# `aws-cross-region` profiles (ticket 65): those read a real bucket under a
# per-run prefix that the `aws cleanup` job deletes, and `create:REGION` makes a
# temporary cross-region bucket that it deletes too.
#
# COST: on-demand eu-west-1 m6i.4xlarge $0.856/h, m6i.2xlarge $0.428/h (m6a and
# c6a are AMD alternatives for a second instance family). The box is rented only
# after both builds succeed; the pilot is ~10-15 box minutes (~$0.1), a full suite
# 1-2 h (~$1-1.7). GitHub-hosted builds are free. A real cross-region profile
# also pays S3 transfer out of the bucket's region (~$0.02/GB).
#
# Several boxes: dispatch the same suite, poc_ref and instance_type once per box
# with one `group` label; the PoC's `python -m bench.telemetry group LABEL` gives
# box-to-box confidence intervals.
name: EXPERIMENT DataFusion SQL PoC benchmarks

on:
  # The registration push: GitHub registers a workflow only once one of its
  # triggers can fire, and an unregistered workflow rejects `workflow_dispatch`.
  # Scoped to this branch and this file; every job is guarded on
  # `workflow_dispatch`, so the registration run rents nothing.
  push:
    branches: [benchmark-winds-datafusion-poc]
    paths: ['.github/workflows/benchmark_datafusion_poc.yml']

  workflow_dispatch:
    inputs:
      poc_ref:
        description: Branch, tag or full sha of G-D-Petrov/arctic-winds holding the PoC tree
        type: string
        default: datafusion-poc
      suite:
        description: >-
          `tpch_sf01_lmdb_pilot` is the correctness pilot (dispatch it with
          instance_type m6i.2xlarge). `check6_gate` is TPC-H SF1 on LMDB and S3,
          five interleaved rounds, with the gate verdict. `tpch_sf1_lmdb_cs` is TPC-H SF1 on LMDB,
          every engine, with MINMAX column stats on the ArcticDB libraries.
          `h2o_1e7` is h2o groupby (with and without NAs) and join at 1e7 on LMDB
          (dispatch it with instance_type m6i.4xlarge, the published c6id.4xlarge's 16 vCPU).
          `check6_shippable` is the gate with `join_enumeration` off; `tpch_sf1_default_layout`
          is cps 127, no stats, `join_enumeration` off; `check6_aws` is the gate's configuration
          on real S3 (aws-same-region gated, aws-cross-region reported).
        type: choice
        options: [tpch_sf01_lmdb_pilot, tpch_sf1, tpch_sf1_lmdb_cs, asof, qb, check6_gate, h2o_1e7,
                  check6_shippable, tpch_sf1_default_layout, check6_aws]
        default: tpch_sf01_lmdb_pilot
      storages:
        description: Comma-separated `lmdb,s3`. Empty keeps the suite's default.
        type: string
        default: ''
      profiles:
        description: >-
          Comma-separated S3 profiles (`none,same-region,cross-region` on the local stack;
          `aws-same-region,aws-cross-region` on real S3). Empty keeps the suite's default.
        type: string
        default: ''
      rounds:
        description: Interleaved rounds. Empty keeps the suite's default.
        type: string
        default: ''
      runs:
        description: Timed runs per round. Empty keeps the suite's default.
        type: string
        default: ''
      instance_type:
        description: >-
          m6i.xlarge, m6i.2xlarge or m6i.4xlarge (Intel), or m6a.2xlarge, m6a.4xlarge, c6a.2xlarge,
          c6a.4xlarge (AMD). Compare numbers only within one instance type.
        type: string
        default: m6i.4xlarge
      market_type:
        description: "`spot` or empty for on-demand. Timing runs should stay on-demand: an interruption loses the run."
        type: string
        default: ''
      settings:
        description: Comma-separated TPC-H session settings (`join_enumeration=false`), added to the suite's. Empty keeps the suite's.
        type: string
        default: ''
      group:
        description: A label shared by dispatches that are one sample of boxes (`check6-m6i-a`). Empty for a one-off run.
        type: string
        default: ''
      flamegraph:
        description: >-
          Comma-separated TPC-H queries (`1,12,11,13,4`) to record with `perf` after the suite, on LMDB,
          for lib.sql and DataFusion-Parquet; SVGs go to a `poc-flamegraphs-*` artifact. Builds
          arcticdb_ext with its symbol table. Empty for none.
        type: string
        default: ''
      aws_same_bucket:
        description: The eu-west-1 bucket for `aws-same-region`. The run uses and deletes a per-run prefix in it.
        type: string
        default: arcticdb-ci-test-bucket-02
      aws_cross_bucket:
        description: "`BUCKET:REGION` for `aws-cross-region`, or `create:REGION` for a temporary bucket the run deletes."
        type: string
        default: 'create:us-east-1'
      rebuild:
        description: Build the wheel and the crate even when an earlier run of this snapshot left them (`reuse builds`).
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: read   # the cibuildwheel image on ghcr.io

# No `concurrency:` block, deliberately: `cancel-in-progress` cancelling a run
# during an EC2 start orphans the instance (benchmark_winds.yml). A leaked box
# carries the `RunId` tag `ec2_runner_jobs.yml` sets.

env:
  # Keep the same as `ec2_runner_jobs.yml`'s `image-id`. One AMI and one
  # instance type per comparison: across either, there is no honest ratio.
  RUNNER_AMI: ami-0936679d3002e5be3
  RUST_TOOLCHAIN: "1.99.1"   # >= 1.95; the toolchain the PoC is built with locally
  TPCHGEN_VERSION: "4.0.0"
  INFERNO_VERSION: "0.12.8"   # perf script -> flame graph SVG, only with the `flamegraph` input
  MATURIN_SPEC: "maturin>=1.10,<2"
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
  DEV_IMAGE: ghcr.io/man-group/arcticdb-dev:latest
  DOCKER_CLI_URL: https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz

jobs:
  # Pins the PoC to one full sha, so both builds compile the same tree even if
  # the branch moves mid-run, and rejects inputs before anything is built.
  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      # `BUCKET:REGION:PREFIX` per real-S3 profile the run reads; empty when it reads none
      aws_same: ${{ steps.aws.outputs.same }}
      aws_cross: ${{ steps.aws.outputs.cross }}
      # `BUCKET:REGION` of a bucket this run created and `aws cleanup` deletes
      aws_created: ${{ steps.aws.outputs.created }}
    steps:
      - name: check the inputs
        env:
          SUITE: ${{ inputs.suite }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          MARKET_TYPE: ${{ inputs.market_type }}
          STORAGES: ${{ inputs.storages }}
          PROFILES: ${{ inputs.profiles }}
          ROUNDS: ${{ inputs.rounds }}
          RUNS: ${{ inputs.runs }}
          SETTINGS: ${{ inputs.settings }}
          GROUP: ${{ inputs.group }}
          FLAMEGRAPH: ${{ inputs.flamegraph }}
          AWS_SAME_BUCKET: ${{ inputs.aws_same_bucket }}
          AWS_CROSS_BUCKET: ${{ inputs.aws_cross_bucket }}
        run: |
          case "$INSTANCE_TYPE" in
            m6i.xlarge|m6i.2xlarge|m6i.4xlarge|m6a.2xlarge|m6a.4xlarge|c6a.2xlarge|c6a.4xlarge) ;;
            *) echo "::error::instance_type $INSTANCE_TYPE is not an allowed m6i, m6a or c6a size"; exit 1 ;;
          esac
          case "$MARKET_TYPE" in
            ''|spot) ;;
            *) echo "::error::market_type must be empty (on-demand) or spot"; exit 1 ;;
          esac
          [[ -z "$STORAGES" || "$STORAGES" =~ ^(lmdb|s3)(,(lmdb|s3))*$ ]] || { echo "::error::bad storages"; exit 1; }
          p='(none|same-region|cross-region|aws-same-region|aws-cross-region)'
          [[ -z "$PROFILES" || "$PROFILES" =~ ^$p(,$p)*$ ]] || { echo "::error::bad profiles"; exit 1; }
          [[ -z "$ROUNDS" || "$ROUNDS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::rounds must be 1-99"; exit 1; }
          [[ -z "$RUNS" || "$RUNS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::runs must be 1-99"; exit 1; }
          kv='[a-z_.]+=[A-Za-z0-9_.-]+'
          [[ -z "$SETTINGS" || "$SETTINGS" =~ ^$kv(,$kv)*$ ]] || { echo "::error::settings must be KEY=VALUE,..."; exit 1; }
          [[ -z "$GROUP" || "$GROUP" =~ ^[A-Za-z0-9_.-]{1,40}$ ]] || { echo "::error::group must be 1-40 of [A-Za-z0-9_.-]"; exit 1; }
          [[ -z "$FLAMEGRAPH" || "$FLAMEGRAPH" =~ ^([1-9]|1[0-9]|2[0-3])(,([1-9]|1[0-9]|2[0-3]))*$ ]] \
            || { echo "::error::flamegraph must be TPC-H query numbers, e.g. 1,12"; exit 1; }
          tpch() { [[ "$SUITE" == tpch_* || "$SUITE" == check6_* ]]; }
          if [ -n "$SETTINGS$FLAMEGRAPH" ] && ! tpch; then
            echo "::error::settings and flamegraph are TPC-H only; $SUITE is not"; exit 1
          fi
          [[ "$AWS_SAME_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || { echo "::error::bad aws_same_bucket"; exit 1; }
          [[ "$AWS_CROSS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]:[a-z]{2}-[a-z]+-[0-9]$ ]] \
            || { echo "::error::aws_cross_bucket must be BUCKET:REGION or create:REGION"; exit 1; }
          [[ "$AWS_CROSS_BUCKET" != *:eu-west-1 ]] || { echo "::error::aws_cross_bucket must not be in eu-west-1, the box's region"; exit 1; }

      - name: check out the PoC
        uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: ${{ inputs.poc_ref }}
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}
          fetch-depth: 1
          sparse-checkout: rust/arcticdb_sql/bench
          persist-credentials: false

      - name: resolve the sha
        id: sha
        env:
          POC_REF: ${{ inputs.poc_ref }}
          SUITE: ${{ inputs.suite }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          MARKET_TYPE: ${{ inputs.market_type }}
          STORAGES: ${{ inputs.storages }}
          PROFILES: ${{ inputs.profiles }}
          ROUNDS: ${{ inputs.rounds }}
          RUNS: ${{ inputs.runs }}
          SETTINGS: ${{ inputs.settings }}
          GROUP: ${{ inputs.group }}
          FLAMEGRAPH: ${{ inputs.flamegraph }}
        run: |
          test -f rust/arcticdb_sql/bench/ec2_driver.py \
            || { echo "::error::$POC_REF has no rust/arcticdb_sql/bench/ec2_driver.py"; exit 1; }
          sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### DataFusion SQL PoC: \`$SUITE\`"
            echo
            echo "- PoC: \`G-D-Petrov/arctic-winds@$sha\` (\`$POC_REF\`)"
            echo "- box: \`$INSTANCE_TYPE\` ${MARKET_TYPE:-on-demand}, AMI \`$RUNNER_AMI\`, eu-west-1"
            d='suite default'
            echo "- storages \`${STORAGES:-$d}\`, profiles \`${PROFILES:-$d}\`, rounds \`${ROUNDS:-$d}\`, runs \`${RUNS:-$d}\`"
            echo "- settings \`${SETTINGS:-$d}\`, group \`${GROUP:-none}\`, flame graphs \`${FLAMEGRAPH:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Catches setup errors before ~25 min of builds and a rented box (run 42413378578 found
      # DuckDB's httpfs missing after 50 min): in the bench image, with the suite's Python
      # packages installed as `run the suite` installs them, the PoC's `bench.preflight`
      # imports the driver, resolves the suite and its inputs, and checks the packages
      # (httpfs when the suite reads S3). The PoC's own builds are stubbed there.
      - name: preflight the suite in the bench image
        env:
          SUITE: ${{ inputs.suite }}
          STORAGES: ${{ inputs.storages }}
          PROFILES: ${{ inputs.profiles }}
          ROUNDS: ${{ inputs.rounds }}
          RUNS: ${{ inputs.runs }}
          SETTINGS: ${{ inputs.settings }}
        run: |
          set -euo pipefail
          if [ ! -f rust/arcticdb_sql/bench/preflight.py ]; then
            echo "::warning::this PoC snapshot has no bench/preflight.py; preflight skipped"; exit 0
          fi
          args=(--suite "$SUITE")
          [ -n "$STORAGES" ] && args+=(--storages "$STORAGES")
          [ -n "$PROFILES" ] && args+=(--profiles "$PROFILES")
          [ -n "$ROUNDS" ] && args+=(--rounds "$ROUNDS")
          [ -n "$RUNS" ] && args+=(--runs "$RUNS")
          if [ -n "$SETTINGS" ]; then
            IFS=, read -ra settings <<< "$SETTINGS"
            for s in "${settings[@]}"; do args+=(--setting "$s"); done
          fi
          docker pull -q "$DEV_IMAGE"
          # The [test] extra from the PoC's pyproject, plus boto3 and arcticdb's pandas and numpy
          docker run --rm -v "$PWD/rust/arcticdb_sql:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1 "$DEV_IMAGE" bash -c '
            set -euo pipefail
            python -m venv /venv
            deps=$(/venv/bin/python -c "import tomllib; print(\"\n\".join(tomllib.load(open(\"pyproject.toml\", \"rb\"))[\"project\"][\"optional-dependencies\"][\"test\"]))")
            mapfile -t deps <<< "$deps"
            /venv/bin/python -m pip install -q --upgrade pip
            /venv/bin/python -m pip install -q "${deps[@]}" boto3 pandas numpy
            /venv/bin/python -m bench.preflight "$@"' _ "${args[@]}"

      # Real S3 (ticket 65), only when the run reads an `aws-*` profile: the box has no
      # instance role, so the engines get the CI's S3 key. This step checks, before
      # anything is built or rented, that the key can write, read (path-style, as
      # DataFusion's `register_s3` does) and delete under the run's prefix in each
      # bucket, and creates the temporary cross-region bucket for `create:REGION`.
      # `aws cleanup` deletes the prefix, and that bucket, whatever happens.
      - name: real S3
        id: aws
        env:
          SUITE: ${{ inputs.suite }}
          STORAGES: ${{ inputs.storages }}
          PROFILES: ${{ inputs.profiles }}
          AWS_SAME_BUCKET: ${{ inputs.aws_same_bucket }}
          AWS_CROSS_BUCKET: ${{ inputs.aws_cross_bucket }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
          PREFIX: dfpoc-bench/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          want=$PROFILES
          if [ -z "$want" ] && [ "$SUITE" = check6_aws ]; then want=aws-same-region,aws-cross-region; fi
          if [ -n "$STORAGES" ] && [[ ",$STORAGES," != *,s3,* ]]; then want=''; fi
          if [[ ",$want," != *,aws-* ]]; then echo "no real-S3 profile"; exit 0; fi
          aws configure set default.s3.addressing_style path
          probe() {   # $1 bucket, $2 region
            local key="$PREFIX/_plan_probe" url="https://s3.$2.amazonaws.com"
            echo probe > /tmp/probe
            aws s3api put-object --endpoint-url "$url" --region "$2" --bucket "$1" --key "$key" --body /tmp/probe > /dev/null
            aws s3api get-object --endpoint-url "$url" --region "$2" --bucket "$1" --key "$key" /tmp/probe.back > /dev/null
            aws s3api delete-object --endpoint-url "$url" --region "$2" --bucket "$1" --key "$key"
            echo "s3://$1/$PREFIX ($2): write, read and delete ok"
          }
          if [[ ",$want," == *,aws-same-region,* ]]; then
            probe "$AWS_SAME_BUCKET" eu-west-1
            printf 'same=%s:eu-west-1:%s\n' "$AWS_SAME_BUCKET" "$PREFIX" >> "$GITHUB_OUTPUT"
          fi
          if [[ ",$want," == *,aws-cross-region,* ]]; then
            bucket=${AWS_CROSS_BUCKET%%:*} region=${AWS_CROSS_BUCKET##*:}
            if [ "$bucket" = create ]; then
              bucket="arcticdb-dfpoc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              cfg=(); [ "$region" = us-east-1 ] || cfg=(--create-bucket-configuration "LocationConstraint=$region")
              aws s3api create-bucket --region "$region" --bucket "$bucket" ${cfg[@]+"${cfg[@]}"} > /dev/null
              # recorded first, so `aws cleanup` removes the bucket even if the probe fails
              printf 'created=%s:%s\n' "$bucket" "$region" >> "$GITHUB_OUTPUT"
              echo "created s3://$bucket in $region"
            fi
            probe "$bucket" "$region"
            printf 'cross=%s:%s:%s\n' "$bucket" "$region" "$PREFIX" >> "$GITHUB_OUTPUT"
          fi

  # ~6 s; the same manylinux image `benchmark_winds.yml` builds with.
  cibw_docker_image:
    name: cibuildwheel image
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/cibw_docker_image.yml
    permissions: {packages: write}
    with:
      cibuildwheel_ver: "3.1.4"   # keep in sync with benchmark_winds.yml
      force_update: false

  # Keys each build and looks for an earlier run's artifact with that key. Every
  # failure here is a miss, which builds as before: an image digest that does not
  # resolve makes the key unique to this run. Artifacts are kept 7 days and are
  # not re-uploaded on a hit, so a snapshot rebuilds a week after its first build.
  reuse:
    name: reuse builds
    needs: [plan, cibw_docker_image]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      wheel_key: ${{ steps.k.outputs.wheel_key }}
      wheel_name: ${{ steps.k.outputs.wheel_name }}
      wheel_run: ${{ steps.k.outputs.wheel_run }}
      crate_key: ${{ steps.k.outputs.crate_key }}
      crate_name: ${{ steps.k.outputs.crate_name }}
      crate_run: ${{ steps.k.outputs.crate_run }}
      cibw_ref: ${{ steps.k.outputs.cibw_ref }}
      manylinux_ref: ${{ steps.k.outputs.manylinux_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/workflows/benchmark_datafusion_poc.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: key the builds and look for them
        id: k
        env:
          GH_TOKEN: ${{ github.token }}
          POC_SHA: ${{ needs.plan.outputs.sha }}
          FLAMEGRAPH: ${{ inputs.flamegraph != '' && '1' || '0' }}
          CIBW_TAG: ${{ needs.cibw_docker_image.outputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
          WORKFLOW_FILE: .github/workflows/benchmark_datafusion_poc.yml
        run: |
          set -euo pipefail
          [[ "$POC_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::plan gave no full sha"; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u token --password-stdin > /dev/null 2>&1 || true
          pin() {   # IMAGE -> IMAGE@sha256:<digest of its manifest>, or IMAGE when it does not resolve
            if docker buildx imagetools inspect --raw "$1" > /tmp/manifest 2> /dev/null && [ -s /tmp/manifest ]; then
              echo "$1@sha256:$(sha256sum /tmp/manifest | cut -d' ' -f1)"
            else
              echo "$1"
            fi
          }
          # sha256 of the named jobs and env entries as parsed YAML, so a comment edit keeps the key;
          # the whole file when that fails
          recipe() {
            python3 - "$WORKFLOW_FILE" "$@" <<'PY' 2> /dev/null || sha256sum "$WORKFLOW_FILE" | cut -d' ' -f1
          import hashlib, json, sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          part = {n: doc["jobs"][n[5:]] if n.startswith("jobs.") else doc["env"][n[4:]] for n in sys.argv[2:]}
          print(hashlib.sha256(json.dumps(part, sort_keys=True).encode()).hexdigest())
          PY
          }
          unique="unpinned=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          cibw_ref=$(pin "$CIBW_TAG")
          manylinux_ref=$(pin "$MANYLINUX_IMAGE")
          wheel_key="v1 poc=$POC_SHA flamegraph=$FLAMEGRAPH image=$cibw_ref recipe=$(recipe jobs.wheel jobs.cibw_docker_image)"
          [[ "$cibw_ref" == *@sha256:* ]] || wheel_key+=" $unique"
          crate_key="v1 poc=$POC_SHA flamegraph=$FLAMEGRAPH image=$manylinux_ref recipe=$(recipe jobs.crate \
            env.RUST_TOOLCHAIN env.TPCHGEN_VERSION env.INFERNO_VERSION env.MATURIN_SPEC env.MANYLINUX_IMAGE)"
          [[ "$manylinux_ref" == *@sha256:* ]] || crate_key+=" $unique"
          name() { echo "$1-$(printf '%s' "$2" | sha256sum | cut -c1-24)"; }
          wheel_name=$(name poc-wheel "$wheel_key")
          crate_name=$(name poc-crate "$crate_key")
          # The newest unexpired artifact NAME from a dispatch of this workflow on this branch
          # of this repository; empty when there is none or the API fails.
          find_run() {
            [ "$REBUILD" != true ] || return 0
            local ids id what
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
                  | jq -r --arg b "$GITHUB_REF_NAME" '[.artifacts[] | select((.expired | not)
                      and .name == $ARGS.positional[0]
                      and .workflow_run.head_repository_id == .workflow_run.repository_id
                      and .workflow_run.head_branch == $b)] | sort_by(.created_at) | reverse | .[].workflow_run.id' \
                      --args "$1") || return 0
            for id in $ids; do
              what=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.path + " " + .event') || continue
              if [ "$what" = "$WORKFLOW_FILE workflow_dispatch" ]; then echo "$id"; return 0; fi
            done
          }
          wheel_run=$(find_run "$wheel_name")
          crate_run=$(find_run "$crate_name")
          {
            echo "wheel_key=$wheel_key"; echo "wheel_name=$wheel_name"; echo "wheel_run=$wheel_run"
            echo "crate_key=$crate_key"; echo "crate_name=$crate_name"; echo "crate_run=$crate_run"
            echo "cibw_ref=$cibw_ref"; echo "manylinux_ref=$manylinux_ref"
          } | tee -a "$GITHUB_OUTPUT"
          how() { if [ -n "$1" ]; then echo "reused from [$1]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$1)"; else echo built; fi; }
          {
            echo "- wheel \`$wheel_name\`: $(how "$wheel_run")"
            echo "- crate \`$crate_name\`: $(how "$crate_run")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Copied from `benchmark_commit_ab.yml`'s `build`, minus the symbol table and
  # DWARF split (no profiling here): checkout from arctic-winds at the planned
  # sha, plain `linux-release` into `/tmp/cpp_build`, which is the directory and
  # preset build.yml fills `arcticdb-ci-sccache-bucket` with, so only the PoC's
  # own C++ (`cpp/arcticdb/sql_api`) misses the cache.
  wheel:
    name: build arcticdb wheel
    needs: [plan, cibw_docker_image, reuse]
    if: github.event_name == 'workflow_dispatch' && needs.reuse.outputs.wheel_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run: {shell: bash}
    env:
      # ---- copied from build_steps.yml:46-79; keep the two in sync ----
      SCCACHE_GHA_VERSION: ${{ secrets.AWS_S3_ACCESS_KEY == null }}
      SCCACHE_BUCKET: arcticdb-ci-sccache-bucket
      SCCACHE_ENDPOINT: http://s3.eu-west-1.amazonaws.com
      SCCACHE_REGION: eu-west-1
      SCCACHE_S3_USE_SSL: false
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      VCPKG_NUGET_USER: ${{ secrets.VCPKG_NUGET_USER || github.repository_owner }}
      VCPKG_NUGET_TOKEN: ${{ secrets.VCPKG_NUGET_TOKEN || secrets.GITHUB_TOKEN }}
      VCPKG_MAN_NUGET_USER: ${{ secrets.VCPKG_MAN_NUGET_USER }}
      VCPKG_MAN_NUGET_TOKEN: ${{ secrets.VCPKG_MAN_NUGET_TOKEN }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # With flame graphs, `benchmark_commit_ab.yml`'s preset that keeps the
      # extension's symbol table (see `keep the C++ symbols` there); same -O3 code.
      ARCTIC_CMAKE_PRESET: ${{ inputs.flamegraph != '' && 'linux-release-symbols' || 'linux-release' }}
      ARCTICDB_BUILD_DIR: /tmp/cpp_build
      CIBW_BUILD: cp311-manylinux_x86_64
      CIBW_ENVIRONMENT_PASS_LINUX: SCCACHE_GHA_VERSION ACTIONS_CACHE_URL ACTIONS_RUNTIME_TOKEN
        VCPKG_INSTALLATION_ROOT VCPKG_BINARY_SOURCES VCPKG_NUGET_USER VCPKG_NUGET_TOKEN
        VCPKG_MAN_NUGET_USER VCPKG_MAN_NUGET_TOKEN CMAKE_C_COMPILER_LAUNCHER
        CMAKE_CXX_COMPILER_LAUNCHER CMAKE_BUILD_PARALLEL_LEVEL ARCTIC_CMAKE_PRESET
        ARCTICDB_BUILD_DIR X_VCPKG_ASSET_SOURCES
        SCCACHE_BUCKET SCCACHE_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
        SCCACHE_REGION SCCACHE_S3_USE_SSL
      CIBW_ENVIRONMENT_LINUX: COPY_VCPKG_DOWNLOADS_TO_HOST=1
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: ${{ needs.plan.outputs.sha }}
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false

      - name: init submodules
        run: |
          git submodule update --init --recursive
          git -C cpp/vcpkg submodule update --init --recursive

      - uses: mozilla-actions/sccache-action@v0.0.9
        with:
          disable_annotations: 'true'

      - name: free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
          docker-images: false

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'   # same pin as build_steps.yml

      - name: extra envs
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.CMAKE_BUILD_PARALLEL_LEVEL }}
        run: |
          HOME=~ . build_tooling/vcpkg_caching.sh
          echo -e "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          VCPKG_ROOT=$PLATFORM_VCPKG_ROOT
          ${X_VCPKG_ASSET_SOURCES:+X_VCPKG_ASSET_SOURCES=$X_VCPKG_ASSET_SOURCES}" | tee -a "$GITHUB_ENV"
          cmake -P cpp/CMake/CpuCount.cmake | sed 's/^-- //' | tee -a "$GITHUB_ENV"

      - name: pull the cibuildwheel manylinux image
        env:
          IMAGE: ${{ needs.reuse.outputs.cibw_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login ghcr.io -u token -p "$GHCR_TOKEN"
          docker pull "$IMAGE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'   # host interpreter that runs cibuildwheel

      # vcpkg's S3 asset-cache fallback (`X_VCPKG_ASSET_SOURCES`, an `aws s3 cp` x-script) runs
      # inside the manylinux container, which has no `aws` (exit 127 when GitHub releases 504ed,
      # runs 42476921761, 42476929001). The snapshot's own before-all, with awscli installed first.
      - name: aws CLI in the build container
        run: |
          set -euo pipefail
          before=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["cibuildwheel"]["linux"]["before-all"])')
          {
            echo 'CIBW_BEFORE_ALL_LINUX<<CIBW_EOF'
            echo 'yum install -y -q awscli || echo "awscli not installed; the S3 asset cache is unavailable"'
            printf '%s\n' "$before"
            echo 'CIBW_EOF'
          } | tee -a "$GITHUB_ENV"

      # Copied from `benchmark_commit_ab.yml`: a user preset that inherits
      # linux-release with ARCTICDB_KEEP_DEBUG_SYMBOLS=ON, in the same build
      # directory, so the sccache bucket still hits.
      - name: keep the C++ symbols in the extension
        if: inputs.flamegraph != ''
        run: |
          cat > cpp/CMakeUserPresets.json <<'JSON'
          {
            "version": 3,
            "configurePresets": [
              {
                "name": "linux-release-symbols",
                "inherits": "linux-release",
                "binaryDir": "${sourceDir}/out/linux-release-build",
                "cacheVariables": {
                  "ARCTICDB_KEEP_DEBUG_SYMBOLS": "ON"
                }
              }
            ]
          }
          JSON
          mkdir -p "$ARCTICDB_BUILD_DIR/linux-release-build"
          ln -sfn linux-release-build "$ARCTICDB_BUILD_DIR/linux-release-symbols-build"

      - name: build the wheel
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ needs.reuse.outputs.cibw_ref }}
          CIBW_VERSION: ${{ needs.cibw_docker_image.outputs.cibuildwheel_ver }}
        run: |
          python -m pip install pipx --retries 3 --timeout 180
          python -m pipx run "cibuildwheel==$CIBW_VERSION"
          ls -l wheelhouse

      # perf names frames from `.symtab`; the DWARF is only size, so drop it and
      # repack (`wheel pack` rewrites RECORD). Fails if no symbol table is left.
      - name: drop the DWARF, keep the symbol table
        if: inputs.flamegraph != ''
        run: |
          set -euo pipefail
          python -m pip install wheel --retries 3 --timeout 180
          wheel=$(ls wheelhouse/*.whl)
          rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
          python -m wheel unpack "$wheel" -d /tmp/unpacked
          so=$(find /tmp/unpacked -name 'arcticdb_ext*.so' | head -1)
          objcopy --strip-debug "$so"
          readelf -SW "$so" | grep -q '\.symtab' || { echo "::error::$(basename "$so") has no .symtab"; exit 1; }
          rm "$wheel"
          python -m wheel pack /tmp/unpacked/* -d wheelhouse
          ls -l wheelhouse

      - name: record the build key
        env:
          KEY: ${{ needs.reuse.outputs.wheel_key }}
        run: printf '%s\n' "$KEY" > wheelhouse/wheel-build-key.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.reuse.outputs.wheel_name }}
          path: |
            wheelhouse/*.whl
            wheelhouse/wheel-build-key.txt
          if-no-files-found: error
          retention-days: 7

  # The `arcticdb_sql` crate and `tpchgen-cli`, built inside manylinux_2_28 so
  # both load in the dev image (glibc 2.28); a plain ubuntu-22.04 build would
  # link glibc 2.35. The crate does not link `arcticdb_ext` (it takes the C API
  # table from a PyCapsule at runtime), so it builds beside the wheel, not after
  # it. bindgen reads `cpp/arcticdb/sql_api/adb_read_api.h`, hence the full
  # checkout and clang-devel. No actions/cache: a DataFusion target dir is
  # gigabytes, and this repository's cache quota is shared with master's CI;
  # `reuse builds` skips the job instead when the snapshot is unchanged.
  crate:
    name: build arcticdb_sql and tpchgen-cli
    needs: [plan, reuse]
    if: github.event_name == 'workflow_dispatch' && needs.reuse.outputs.crate_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    defaults:
      run: {shell: bash}
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false
          docker-images: true

      - uses: actions/checkout@v4
        with:
          repository: G-D-Petrov/arctic-winds
          ref: ${{ needs.plan.outputs.sha }}
          ssh-key: ${{ secrets.ARCTIC_WINDS_DEPLOY_KEY }}
          fetch-depth: 1
          persist-credentials: false
          path: poc

      - name: build in manylinux_2_28
        env:
          FLAMEGRAPH: ${{ inputs.flamegraph }}
          IMAGE: ${{ needs.reuse.outputs.manylinux_ref }}
        run: |
          mkdir -p out/bin out/dist out/cargo
          docker run --rm \
            -e RUST_TOOLCHAIN -e TPCHGEN_VERSION -e MATURIN_SPEC -e INFERNO_VERSION -e FLAMEGRAPH \
            -e CARGO_HOME=/w/out/cargo -e CARGO_TARGET_DIR=/w/target \
            -e CARGO_NET_GIT_FETCH_WITH_CLI=true \
            -v "$GITHUB_WORKSPACE:/w" -w /w "$IMAGE" bash -euo pipefail -c '
              dnf install -y -q clang-devel >/dev/null
              export LIBCLANG_PATH=$(dirname "$(find /usr/lib64 -name "libclang.so*" | head -1)")
              curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --no-modify-path
              export PATH=$CARGO_HOME/bin:$PATH
              rustc --version
              PY=/opt/python/cp311-cp311/bin/python
              $PY -m pip install -q "$MATURIN_SPEC"
              cd /w/poc/rust/arcticdb_sql
              $PY -m maturin build --release --locked -i "$PY" --compatibility manylinux_2_28 --out /w/out/dist
              cargo install --locked --root /w/out "tpchgen-cli@$TPCHGEN_VERSION"
              /w/out/bin/tpchgen-cli --version
              if [ -n "$FLAMEGRAPH" ]; then cargo install --locked --root /w/out "inferno@$INFERNO_VERSION"; fi
            '

      # Everything the box needs from the PoC tree besides the two wheels: the
      # bench package, and DataFusion's query files at the crate's pinned rev
      # (cargo's own checkout of the git dependency), which bench.perf_tpch and
      # bench.perf_asof read.
      - name: stage the bench inputs
        env:
          KEY: ${{ needs.reuse.outputs.crate_key }}
        run: |
          set -euo pipefail
          df=$(find out/cargo/git/checkouts -mindepth 2 -maxdepth 2 -path '*/datafusion-*/*' -type d | head -1)
          test -d "$df/benchmarks/sql_benchmarks/tpch/benchmarks"
          mkdir -p stage/datafusion/benchmarks stage/src/rust stage/bin
          cp -r "$df/benchmarks/sql_benchmarks" stage/datafusion/benchmarks/
          tar -C poc -cf - --exclude=target --exclude=__pycache__ rust/arcticdb_sql | tar -C stage/src -xf -
          cp out/bin/tpchgen-cli stage/bin/
          for tool in inferno-collapse-perf inferno-flamegraph; do
            if [ -x "out/bin/$tool" ]; then cp "out/bin/$tool" stage/bin/; fi
          done
          cp out/dist/*.whl stage/
          printf '%s\n' "$KEY" > stage/crate-build-key.txt
          ls -l stage stage/bin
          du -sh stage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.reuse.outputs.crate_name }}
          path: stage/
          if-no-files-found: error
          retention-days: 7

  # The box is rented only once both builds have succeeded.
  start:
    name: start runner
    needs: [plan, reuse, wheel, crate]
    # A build skipped by `reuse builds` counts as built; `!cancelled()` because a
    # skipped need otherwise skips this job.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch'
      && needs.plan.result == 'success' && needs.reuse.result == 'success'
      && (needs.wheel.result == 'success' || (needs.wheel.result == 'skipped' && needs.reuse.outputs.wheel_run != ''))
      && (needs.crate.result == 'success' || (needs.crate.result == 'skipped' && needs.reuse.outputs.crate_run != ''))
    uses: ./.github/workflows/ec2_runner_jobs.yml
    secrets: inherit
    with:
      job_type: start
      instance-type: ${{ inputs.instance_type }}
      market-type: ${{ inputs.market_type }}
      image-id: ami-0936679d3002e5be3   # = env.RUNNER_AMI; `env` is not available to a `uses:` job

  bench:
    name: bench ${{ inputs.suite }}
    needs: [plan, reuse, start]
    # `ec2_runner_jobs.yml` sets `continue-on-error: true` on start, so a failed
    # start arrives green with an empty label; without this guard the job queues
    # against a label no runner ever claims.
    # `!cancelled()`: a wheel or crate skipped by `reuse builds` would otherwise skip it.
    if: "!cancelled() && needs.start.result == 'success' && needs.start.outputs.label != ''"
    runs-on: ${{ needs.start.outputs.label }}
    timeout-minutes: 180   # never above ~180: a longer timeout is a blank cheque on a stuck box
    # checks: write lets `run the suite` post the driver's per-query events to a
    # `dfpoc-live-<run id>` check run while it runs (job logs appear only when a
    # job ends). A job-level block replaces the workflow's, so restate the rest.
    permissions:
      contents: read
      actions: read
      packages: read
      checks: write
    defaults:
      run: {shell: bash}
    env:
      WORK: ${{ github.workspace }}/poc-run
    steps:
      - name: record the box
        run: |
          token=$(curl -sS -m 2 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' || true)
          meta() { curl -sS -m 2 -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/$1" 2>/dev/null || echo unknown; }
          {
            echo "runner: $(meta instance-id) $(meta instance-type) ami=$(meta ami-id) lifecycle=$(meta instance-life-cycle) az=$(meta placement/availability-zone)"
            echo "nproc $(nproc), $(grep MemTotal /proc/meminfo)"
            df -h "$GITHUB_WORKSPACE" /var/lib/docker 2>/dev/null || df -h
            docker version --format 'docker {{.Server.Version}}'
            echo "perf_event_paranoid $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unknown)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # From this run, or from the earlier run `reuse builds` found (a token is
      # what makes download-artifact read another run).
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reuse.outputs.wheel_name }}
          path: ${{ env.WORK }}/wheels
          run-id: ${{ needs.reuse.outputs.wheel_run }}
          github-token: ${{ needs.reuse.outputs.wheel_run != '' && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reuse.outputs.crate_name }}
          path: ${{ env.WORK }}
          run-id: ${{ needs.reuse.outputs.crate_run }}
          github-token: ${{ needs.reuse.outputs.crate_run != '' && github.token || '' }}

      - name: check the builds are this run's
        env:
          WHEEL_KEY: ${{ needs.reuse.outputs.wheel_key }}
          CRATE_KEY: ${{ needs.reuse.outputs.crate_key }}
        run: |
          set -euo pipefail
          [ "$(cat "$WORK/wheels/wheel-build-key.txt")" = "$WHEEL_KEY" ] || { echo "::error::the wheel artifact has another key"; exit 1; }
          [ "$(cat "$WORK/crate-build-key.txt")" = "$CRATE_KEY" ] || { echo "::error::the crate artifact has another key"; exit 1; }
          echo "wheel and crate keys match"

      - name: pull the images
        run: |
          docker pull -q "$DEV_IMAGE"
          docker pull -q chrislusf/seaweedfs:4.45
          docker pull -q ghcr.io/shopify/toxiproxy:2.9.0

      - name: run the suite
        env:
          SUITE: ${{ inputs.suite }}
          STORAGES: ${{ inputs.storages }}
          PROFILES: ${{ inputs.profiles }}
          ROUNDS: ${{ inputs.rounds }}
          RUNS: ${{ inputs.runs }}
          SETTINGS: ${{ inputs.settings }}
          FLAMEGRAPH: ${{ inputs.flamegraph }}
          GH_TOKEN: ${{ github.token }}
          LIVE_EVENTS_INTERVAL: '60'
          # Real S3 (the `real S3` plan step): the targets, and the CI key only when there is one
          DFPOC_AWS_S3_SAME_REGION: ${{ needs.plan.outputs.aws_same }}
          DFPOC_AWS_S3_CROSS_REGION: ${{ needs.plan.outputs.aws_cross }}
          AWS_ACCESS_KEY_ID: ${{ (needs.plan.outputs.aws_same != '' || needs.plan.outputs.aws_cross != '') && secrets.AWS_S3_ACCESS_KEY || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (needs.plan.outputs.aws_same != '' || needs.plan.outputs.aws_cross != '') && secrets.AWS_S3_SECRET_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/out" "$WORK/data"
          chmod +x "$WORK/bin/tpchgen-cli"
          cat > "$WORK/run.sh" <<'SH'
          set -euo pipefail
          curl -fsSL "$DOCKER_CLI_URL" | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          python -m venv /venv
          /venv/bin/python -m pip install -q --upgrade pip
          /venv/bin/python -m pip install -q /work/wheels/arcticdb-*.whl "$(ls /work/arcticdb_sql-*.whl)[test]" boto3
          /venv/bin/python -c "import arcticdb, arcticdb_sql, sys; print(sys.version, arcticdb.__version__)"
          args=(--suite "$SUITE" --data-dir /work/data --out-dir /work/out --tpchgen /work/bin/tpchgen-cli
                --datafusion-dir /work/datafusion --s3-host-network)
          [ -n "$STORAGES" ] && args+=(--storages "$STORAGES")
          [ -n "$PROFILES" ] && args+=(--profiles "$PROFILES")
          [ -n "$ROUNDS" ] && args+=(--rounds "$ROUNDS")
          [ -n "$RUNS" ] && args+=(--runs "$RUNS")
          if [ -n "$SETTINGS" ]; then
            IFS=, read -ra settings <<< "$SETTINGS"
            for s in "${settings[@]}"; do args+=(--setting "$s"); done
          fi
          cd /work/src/rust/arcticdb_sql
          rc=0
          /venv/bin/python -m bench.ec2_driver "${args[@]}" || rc=$?
          # After the timed suite, so it never perturbs a timing; never fails the run.
          if [ -n "$FLAMEGRAPH" ]; then
            dnf install -y -q perf > /dev/null || dnf install -y -q --enablerepo='*' perf > /dev/null || true
            /venv/bin/python -m bench.perf_flamegraph --out-dir /work/out --data-dir /work/data \
              --queries "$FLAMEGRAPH" --tools-dir /work/bin || echo "flame graphs failed (ignored)"
          fi
          exit $rc
          SH
          # Live per-query events (rust/arcticdb_sql/bench/TELEMETRY.md in the PoC):
          # the driver appends DFPOC_EVENT lines to out/events.jsonl, and every
          # LIVE_EVENTS_INTERVAL seconds the first line (the start event) and the
          # latest ~58 KB go to a check run's text, which the PoC's telemetry
          # watcher reads. Best effort: a failed post never fails the step.
          events="$WORK/out/events.jsonl"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          live_post() {   # $1: extra top-level JSON fields, each followed by a comma
            [ -n "$cr" ] || return 0
            local text=''
            if [ -s "$events" ]; then
              text=$( { head -n 1 "$events"; tail -c 58000 "$events" | tail -n +2; } \
                | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk 'NR > 1 { printf "\\n" } { printf "%s", $0 }' )
            fi
            printf '{%s"output":{"title":"DataFusion PoC live events","summary":"DFPOC_EVENT lines: the first, then the latest","text":"%s"}}' "$1" "$text" \
              | curl -fsS -m 20 -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "$api/check-runs/$cr" --data @- > /dev/null \
              || echo "live events: post failed (ignored)"
          }
          cr=''
          created=$(curl -fsS -m 20 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                      "$api/check-runs" \
                      -d "{\"name\":\"dfpoc-live-$GITHUB_RUN_ID\",\"head_sha\":\"$GITHUB_SHA\",\"status\":\"in_progress\"}") || created=''
          if [[ $created =~ \"id\":\ *([0-9]+) ]]; then cr=${BASH_REMATCH[1]}; fi   # the first "id" is the check run's
          echo "live events check run: ${cr:-none}"
          ( while sleep "$LIVE_EVENTS_INTERVAL"; do live_post ''; done ) &
          poster=$!

          extra=()
          if [ -n "${DFPOC_AWS_S3_SAME_REGION:-}${DFPOC_AWS_S3_CROSS_REGION:-}" ]; then
            extra+=(-e DFPOC_AWS_S3_SAME_REGION -e DFPOC_AWS_S3_CROSS_REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY)
          fi
          # What `perf record` needs in the container and no more (benchmark_worker.yml, gha 74)
          if [ -n "${FLAMEGRAPH:-}" ]; then extra+=(--cap-add PERFMON --cap-add SYS_ADMIN); fi
          rc=0
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$WORK:/work" \
            -e SUITE -e STORAGES -e PROFILES -e ROUNDS -e RUNS -e SETTINGS -e FLAMEGRAPH -e DOCKER_CLI_URL \
            -e DFPOC_EVENTS_FILE=/work/out/events.jsonl \
            ${extra[@]+"${extra[@]}"} "$DEV_IMAGE" bash /work/run.sh || rc=$?
          kill "$poster" 2> /dev/null || true
          wait "$poster" 2> /dev/null || true
          live_post "\"status\":\"completed\",\"conclusion\":\"neutral\","
          if [ -f "$WORK/out/summary.md" ]; then cat "$WORK/out/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $rc

      - name: upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-results-${{ inputs.suite }}-${{ inputs.instance_type }}
          path: |
            ${{ env.WORK }}/out/
            !${{ env.WORK }}/out/flamegraphs/
          if-no-files-found: warn
          retention-days: 7

      - name: upload the flame graphs
        if: always() && inputs.flamegraph != ''
        uses: actions/upload-artifact@v4
        with:
          name: poc-flamegraphs-${{ inputs.suite }}-${{ inputs.instance_type }}
          path: ${{ env.WORK }}/out/flamegraphs/
          if-no-files-found: warn
          retention-days: 7

  no_runner:
    name: no runner arrived
    needs: [start]
    if: always() && github.event_name == 'workflow_dispatch' && needs.start.result != 'skipped' && needs.start.outputs.label == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          START_RESULT: ${{ needs.start.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::error::No EC2 runner arrived (start: ${START_RESULT}). A start that died after launch can orphan an instance: look for one tagged RunId=${RUN_ID}."
          exit 1

  # Deletes the run's prefix in every real-S3 bucket, and the bucket it created,
  # on a GitHub-hosted runner, whatever happened to the box. A failure here can
  # leave data or a bucket behind: look for `dfpoc-bench/<run id>-*` prefixes and
  # `arcticdb-dfpoc-<run id>-*` buckets. The weekly `scheduled_cleanup.yml`
  # empties the CI test bucket anyway.
  aws_cleanup:
    name: aws cleanup
    needs: [plan, bench]
    if: always() && (needs.plan.outputs.aws_same != '' || needs.plan.outputs.aws_cross != '' || needs.plan.outputs.aws_created != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
      SAME: ${{ needs.plan.outputs.aws_same }}
      CROSS: ${{ needs.plan.outputs.aws_cross }}
      CREATED: ${{ needs.plan.outputs.aws_created }}
      PREFIX: dfpoc-bench/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: delete the run's objects and bucket
        run: |
          set -uo pipefail
          rc=0
          for target in "$SAME" "$CROSS"; do
            [ -n "$target" ] || continue
            IFS=: read -r bucket region prefix <<< "$target"
            [ "$prefix" = "$PREFIX" ] || { echo "::error::refusing to delete $prefix, not this run's prefix"; rc=1; continue; }
            if aws s3 rm --region "$region" --recursive --only-show-errors "s3://$bucket/$prefix/"; then
              echo "deleted s3://$bucket/$prefix/"
            else
              rc=1
            fi
          done
          if [ -n "$CREATED" ]; then
            IFS=: read -r bucket region <<< "$CREATED"
            [[ "$bucket" == "arcticdb-dfpoc-$GITHUB_RUN_ID-"* ]] || { echo "::error::refusing to delete $bucket"; exit 1; }
            if aws s3 rb --region "$region" --force "s3://$bucket"; then echo "deleted bucket s3://$bucket"; else rc=1; fi
          fi
          [ $rc -eq 0 ] || echo "::error::cleanup incomplete: see above for what is left"
          exit $rc

  # `if: always()`, not `!cancelled()`: a cancelled run is exactly when a
  # forgotten instance costs money. The window this cannot cover is a cancel
  # *during* start, sweepable by the `RunId` tag.
  stop:
    name: stop runner
    needs: [start, bench]
    if: always() && github.event_name == 'workflow_dispatch' && needs.start.result != 'skipped'
    uses: ./.github/workflows/ec2_runner_jobs.yml
    secrets: inherit
    with:
      job_type: stop
      label: ${{ needs.start.outputs.label }}
      ec2-instance-id: ${{ needs.start.outputs.ec2-instance-id }}
