<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">
  <rect width="1180" height="860" fill="#ffffff"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f8d4d4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-width="3"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="17" font-weight="bold">EncodedFieldCollection::add_field(0): placement new writes 88 B into a 42 B slot</text>
  <text x="30" y="56" font-size="11">Before the fix. calc_field_bytes(n) = 42 + 46·n reserves too little for n = 0, but new (ptr) EncodedFieldImpl constructs all sizeof(EncodedFieldImpl) = 88 B, including the inline blocks_[0].</text>

  <!-- ===================== Panel 1: struct layout ===================== -->
  <text x="30" y="100" font-size="15" font-weight="bold">1. EncodedFieldImpl layout (packed)</text>
  <rect x="60" y="116" width="40" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="100" y="116" width="60" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="160" y="116" width="60" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="220" y="116" width="80" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="300" y="116" width="60" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="360" y="116" width="40" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="400" y="116" width="160" height="44" fill="#e6f2e1" stroke="#3d7a2e"/>
  <rect x="560" y="116" width="250" height="44" fill="#cfe0f5" stroke="#2c5d94"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="80" y="135">type_</text><text x="80" y="152">1</text>
    <text x="130" y="135">shapes_</text><text x="130" y="152">4</text>
    <text x="190" y="135">values_</text><text x="190" y="152">4</text>
    <text x="260" y="135">sparse_map</text><text x="260" y="152">4</text>
    <text x="330" y="135">items_</text><text x="330" y="152">4</text>
    <text x="380" y="135">fmt</text><text x="380" y="152">1</text>
    <text x="480" y="135">stats_</text><text x="480" y="152">24</text>
    <text x="685" y="135">blocks_[0]  (std::array&lt;Block, 1&gt;)</text><text x="685" y="152">46</text>
  </g>
  <path d="M60,170 v8 h500 v-8" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="310" y="194" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">EncodedFieldImpl::Size = 42 B</text>
  <path d="M60,204 v8 h750 v-8" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="435" y="228" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">sizeof(EncodedFieldImpl) = 88 B   (what the constructor writes)</text>
  <text x="840" y="132" font-size="11">Blocks 1..n-1 follow in the buffer,</text>
  <text x="840" y="147" font-size="11">past the end of the struct.</text>
  <text x="840" y="168" font-family="Menlo, Consolas, monospace" font-size="12">slot(n) = 42 + 46·n</text>
  <text x="840" y="186" font-family="Menlo, Consolas, monospace" font-size="12">slot(0) = 42  &lt; 88</text>

  <!-- ===================== Panel 2: mid-buffer, harmless ===================== -->
  <text x="30" y="282" font-size="15" font-weight="bold">2. Zero-block field mid-buffer: the overrun lands in spare capacity (harmless)</text>
  <text x="60" y="304" font-size="11">One ChunkedBuffer block of the collection's data_. Bytes past bytes() are unused capacity that the next add_field will claim.</text>

  <rect x="60" y="338" width="100" height="56" fill="#cfe0f5" stroke="#2c5d94"/>
  <text x="110" y="360" text-anchor="middle">field 0</text><text x="110" y="378" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=1 · 88 B</text>
  <rect x="160" y="338" width="150" height="56" fill="#cfe0f5" stroke="#2c5d94"/>
  <text x="235" y="360" text-anchor="middle">field 1</text><text x="235" y="378" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=2 · 134 B</text>
  <rect x="310" y="338" width="130" height="56" fill="#fafafa" stroke="#aaa"/>
  <text x="375" y="364" text-anchor="middle" font-size="20">…</text>
  <text x="375" y="382" text-anchor="middle" font-size="11">42 + 46·n each</text>
  <rect x="440" y="338" width="48" height="56" fill="#e6f2e1" stroke="#3d7a2e" stroke-width="2.5"/>
  <text x="464" y="360" text-anchor="middle" font-size="11">field j</text><text x="464" y="378" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">42 B</text>
  <rect x="488" y="338" width="52" height="56" fill="url(#hatch)" stroke="#c0392b" stroke-width="2"/>
  <rect x="540" y="338" width="300" height="56" fill="#f4f4f4" stroke="#999999" stroke-dasharray="4 3"/>
  <text x="690" y="370" text-anchor="middle" font-size="11">spare capacity (beyond bytes(), inside the allocation)</text>
  <line x1="840" y1="330" x2="840" y2="408" stroke="#333" stroke-width="2"/>
  <text x="846" y="418" font-size="11">end of allocation</text>

  <path d="M440,330 v-6 h100 v6" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="490" y="318" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#c0392b">ctor writes 88 B</text>
  <g font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <line x1="440" y1="394" x2="440" y2="404" stroke="#555555"/><text x="440" y="416">o</text>
    <line x1="488" y1="394" x2="488" y2="404" stroke="#555555"/><text x="488" y="416">o+42</text>
    <line x1="540" y1="394" x2="540" y2="404" stroke="#555555"/><text x="540" y="416">o+88</text>
  </g>
  <text x="60" y="446" font-size="11">The 46 B written past the slot (hatched) become the start of field j+1's slot. add_field(n) for field j+1 constructs over them again, so the stray zeros are never seen.</text>

  <!-- ===================== Panel 3: block end, heap corruption ===================== -->
  <text x="30" y="478" font-size="15" font-weight="bold">3. Zero-block field at the end of a block: the overrun leaves the allocation (heap corruption)</text>
  <text x="60" y="500" font-size="11">ensure() placed the 42 B slot so that it ends exactly at the end of the block. Valgrind: "Invalid write of size 8 … 0 bytes after a block of size 4,096" in std::array&lt;Block,1&gt;::array().</text>

  <rect x="60" y="540" width="100" height="64" fill="#cfe0f5" stroke="#2c5d94"/>
  <text x="110" y="564" text-anchor="middle">field 0</text><text x="110" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=1 · 88 B</text>
  <rect x="160" y="540" width="48" height="64" fill="#e6f2e1" stroke="#3d7a2e"/>
  <text x="184" y="564" text-anchor="middle" font-size="11">field 1</text><text x="184" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=0</text><text x="184" y="598" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">42 B</text>
  <rect x="208" y="540" width="150" height="64" fill="#cfe0f5" stroke="#2c5d94"/>
  <text x="283" y="564" text-anchor="middle">field 2</text><text x="283" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=2 · 134 B</text>
  <rect x="358" y="540" width="200" height="64" fill="#fafafa" stroke="#aaa"/>
  <text x="458" y="568" text-anchor="middle" font-size="20">…</text>
  <text x="458" y="588" text-anchor="middle" font-size="11">more fields, 42 + 46·n B each</text>
  <rect x="558" y="540" width="100" height="64" fill="#cfe0f5" stroke="#2c5d94"/>
  <text x="608" y="564" text-anchor="middle">field k</text><text x="608" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=1 · 88 B</text>
  <rect x="658" y="540" width="48" height="64" fill="#e6f2e1" stroke="#3d7a2e" stroke-width="2.5"/>
  <text x="682" y="564" text-anchor="middle" font-size="11">field k+1</text><text x="682" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12">n=0</text><text x="682" y="598" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">42 B</text>

  <rect x="706" y="540" width="420" height="64" fill="#dddddd" stroke="#777777"/>
  <rect x="706" y="540" width="52" height="64" fill="url(#hatch)" stroke="#c0392b" stroke-width="2"/>
  <rect x="711" y="555" width="42" height="34" fill="#ffffff" fill-opacity="0.9"/>
  <text x="732" y="568" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#7b1d14">46 B</text>
  <text x="732" y="584" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7b1d14">OOB</text>
  <text x="940" y="562" text-anchor="middle" font-size="11">not owned by this ChunkedBuffer:</text>
  <text x="940" y="578" text-anchor="middle" font-size="11">next heap chunk's glibc header (size, prev_inuse)</text>
  <text x="940" y="594" text-anchor="middle" font-size="11">and the start of another allocation</text>

  <line x1="706" y1="524" x2="706" y2="624" stroke="#c0392b" stroke-width="3"/>
  <text x="712" y="636" font-size="11" fill="#c0392b" font-weight="bold">end of the 4,096 B allocation</text>

  <path d="M658,532 v-8 h100 v8" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="708" y="516" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#c0392b">new (ptr) EncodedFieldImpl: 88 B</text>

  <g font-family="Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <line x1="60" y1="604" x2="60" y2="614" stroke="#555555"/><text x="60" y="628">0</text>
    <line x1="160" y1="604" x2="160" y2="614" stroke="#555555"/><text x="160" y="628">88</text>
    <line x1="208" y1="604" x2="208" y2="614" stroke="#555555"/><text x="208" y="628">130</text>
    <line x1="358" y1="604" x2="358" y2="614" stroke="#555555"/><text x="358" y="628">264</text>
    <line x1="558" y1="604" x2="558" y2="614" stroke="#555555"/><text x="558" y="628">3966</text>
    <line x1="658" y1="604" x2="658" y2="614" stroke="#555555"/><text x="652" y="628">4054</text>
    <line x1="758" y1="604" x2="758" y2="614" stroke="#555555"/><text x="768" y="652">4142</text>
  </g>

  <g font-size="11">
    <text x="60" y="682">1. add_field(0): data_.ensure(offset_ + 42) succeeds, and ptr_cast(4054, 42) passes its bounds check, because 4054 + 42 ≤ bytes().</text>
    <text x="60" y="702">2. new (ptr) EncodedFieldImpl runs the defaulted constructor: 42 B of header initialisers, then std::array&lt;Block,1&gt; zeroes blocks_[0], bytes 4096–4141.</text>
    <text x="60" y="722">3. Those 46 B overwrite the next heap chunk's metadata. glibc notices on a later malloc/free: sysmalloc assertion, "corrupted size vs. prev_size", "free(): invalid pointer".</text>
    <text x="60" y="742">4. The read path (encoded_fields_from_proto) reserves exactly Σ(42 + 46·n) in one allocation, so a trailing zero-block field always lands like field k+1 once the total exceeds 4 KB.</text>
  </g>

  <!-- ===================== Legend ===================== -->
  <g transform="translate(60,786)" font-size="11">
    <rect width="18" height="14" fill="#cfe0f5" stroke="#2c5d94"/><text x="24" y="11">field with blocks</text>
    <rect x="150" width="18" height="14" fill="#e6f2e1" stroke="#3d7a2e"/><text x="174" y="11">field with no blocks (42 B)</text>
    <rect x="350" width="18" height="14" fill="#e6f2e1" stroke="#3d7a2e" stroke-width="2.5"/><text x="374" y="11">slot being constructed</text>
    <rect x="530" width="18" height="14" fill="url(#hatch)" stroke="#c0392b" stroke-width="2"/><text x="554" y="11">written by the constructor past the slot</text>
    <rect x="800" width="18" height="14" fill="#dddddd" stroke="#777777"/><text x="824" y="11">memory outside the allocation</text>
  </g>
  <text x="60" y="834" font-size="11">Fix: calc_field_bytes(n) = 42 + 46·max(n, 1), so every slot holds sizeof(EncodedFieldImpl). static_assert(calc_field_bytes(0) &gt;= sizeof(EncodedFieldImpl)).</text>
</svg>
