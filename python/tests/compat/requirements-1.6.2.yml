name: arcticdb
channels:
  - conda-forge
dependencies:
  - arcticdb=1.6.2
  # conda-forge libcxx 23.1.5 rebuilds drop a symbol arcticdb 1.6.2 needs (conda-forge/libcxx-feedstock#308)
  - sel(osx): libcxx<23
  - numpy<2
  - pandas<2
  - attrs
  - protobuf<5
# - msgpack>=0.5.0
  - pyyaml
  - packaging
  - pyarrow
  - pytest